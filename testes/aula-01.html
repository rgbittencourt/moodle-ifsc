// FLASHCARD — single flippable card (click to flip)
function FlashCard({ front, back, tone = "marigold" }) {
  const [flipped, setFlipped] = useState(false);
  const safeTone = AULA_TONES[tone] ? tone : "marigold";
  return (
    <button
      type="button"
      className="aula-flash"
      data-tone={safeTone}
      onClick={() => setFlipped((f) => !f)}
      aria-label={`Flashcard. ${flipped ? "Mostrando resposta" : "Mostrando pergunta"}. Clique para virar.`}
    >
      <div className={"aula-flash__inner" + (flipped ? " is-flipped" : "")}>
        <div className="aula-flash__face aula-flash__front">
          <span className="aula-flash__tag">Pergunta</span>
          <RichContent className="aula-flash__front-text" html={front}/>
          <span className="aula-flash__hint"><Icon name="rotate-ccw" size={13} color="var(--ink-mute)" /> clique para virar</span>
        </div>
        <div className="aula-flash__face aula-flash__back">
          <span className="aula-flash__tag aula-flash__tag--back">Resposta</span>
          <RichContent className="aula-flash__back-text" html={back}/>
        </div>
      </div>
    </button>
  );
}

// FLASHCARD DECK — multiple flashcards as a swipeable strip
function FlashCardDeck({ cards = [], tones = [], sectionTone = "paper", label = "Flashcards" }) {
  if (usePDF()) {
    // PDF: the deck only mounts one card on screen, so render every card
    // from data, front AND back side by side.
    return (
      <div className="aula-deck-print">
        <div className="aula-deck__label aula-kicker">
          <Icon name="layers" size={16} stroke={1.8} />
          <span>{label}</span>
        </div>
        <div className="aula-deck-print__grid">
          {cards.map((c, idx) => (
            <div key={idx} className="aula-flashcard-print">
              <div className="aula-flashcard-print__side aula-flashcard-print__side--front">
                <div className="aula-flashcard-print__tag">Pergunta {idx + 1}</div>
                <RichContent className="aula-flashcard-print__front" html={c.front}/>
              </div>
              <div className="aula-flashcard-print__side aula-flashcard-print__side--back">
                <div className="aula-flashcard-print__tag">Resposta</div>
                <RichContent className="aula-flashcard-print__back" html={c.back}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }
  const [i, setI] = useState(0);
  const max = cards.length;
  // No card may share the section's background colour — keep good contrast.
  const palette = (tones.length ? tones : ["marigold", "sage", "lavender", "coral", "ocean"]);
  const safeTones = palette.filter((t) => t !== sectionTone);
  const deckTones = safeTones.length ? safeTones : ["marigold", "sage", "lavender", "coral", "ocean"].filter((t) => t !== sectionTone);
  const toneFor = (idx) => {
    const explicit = cards[idx]?.tone;
    if (explicit && explicit !== sectionTone) return explicit;
    return deckTones[idx % deckTones.length] || "marigold";
  };
  return (
    <div className="aula-deck">
      <div className="aula-deck__head">
        <div className="aula-deck__label aula-kicker">
          <Icon name="layers" size={16} stroke={1.8} />
          <span>{label}</span>
        </div>
        <div className="aula-deck__counter">{i + 1} / {max}</div>
      </div>
      <div className="aula-deck__cardwrap">
        <FlashCard
          key={i}
          front={cards[i]?.front}
          back={cards[i]?.back}
          tone={toneFor(i)}
        />
      </div>
      <div className="aula-deck__controls">
        <button
          type="button"
          className="aula-deck__nav"
          onClick={() => setI((v) => Math.max(0, v - 1))}
          disabled={i === 0}
          aria-label="Anterior"
        >
          <Icon name="arrow-left" size={18} stroke={1.8} />
        </button>
        <div className="aula-deck__dots">
          {cards.map((_, idx) => (
            <button key={idx} type="button" onClick={() => setI(idx)} aria-label={`Ir para card ${idx + 1}`}
              className={"aula-deck__dot" + (idx === i ? " is-active" : "")}></button>
          ))}
        </div>
        <button
          type="button"
          className="aula-deck__nav"
          onClick={() => setI((v) => Math.min(max - 1, v + 1))}
          disabled={i === max - 1}
          aria-label="Próximo"
        >
          <Icon name="arrow-right" size={18} stroke={1.8} />
        </button>
      </div>
    </div>
  );
}

// SLIDER — horizontal carousel of full panels (step-by-step)
function SliderMarker({ step, index, print = false }) {
  const className = print ? "aula-step-print__num" : "aula-slider__num";
  if (step.icon) return <span className={className}><i className={fontAwesomeClass(step.icon)} aria-hidden="true"></i></span>;
  return <span className={className}>{step.marker || String(index + 1).padStart(2, "0")}</span>;
}

function RichContent({ html, className, tag = "div" }) {
  if (React.isValidElement(html)) return React.createElement(tag, { className }, html);
  return React.createElement(tag, { className, dangerouslySetInnerHTML: { __html: html || "" } });
}
function richPlain(value) {
  const source = React.isValidElement(value) ? value.props?.html : value;
  return String(source || "").replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim();
}
function RichInline({ value, className }) {
  if (React.isValidElement(value)) return <span className={className}>{value}</span>;
  return <span className={className} dangerouslySetInnerHTML={{ __html: value || "" }} />;
}

function Slider({ steps = [], label = "Passo a passo" }) {
  if (usePDF()) {
    // PDF: stack every step vertically so nothing stays behind the carousel.
    return (
      <div className="aula-card aula-slider-print">
        {label && <div className="aula-slider__label aula-kicker">
          <Icon name="play" size={14} stroke={0} color="var(--ink-mute)" style={{ fill: "var(--ink-mute)" }} />
          <span>{label}</span>
        </div>}
        <ol className="aula-slider-print__list">
          {steps.map((s, idx) => (
            <li key={idx} className="aula-step-print">
              <SliderMarker step={s} index={idx} print />
              <div>
                <RichInline className="aula-step-print__title" value={s.title} />
                <RichContent className="aula-step-print__body" html={s.body} />
              </div>
            </li>
          ))}
        </ol>
      </div>
    );
  }
  const [i, setI] = useState(0);
  const max = steps.length;
  return (
    <div className="aula-slider">
      <div className="aula-slider__head">
        {label && <div className="aula-slider__label aula-kicker">
          <Icon name="play" size={14} stroke={0} color="var(--ink-mute)" style={{ fill: "var(--ink-mute)" }} />
          <span>{label}</span>
        </div>}
        <div className="aula-slider__progress">
          {steps.map((_, idx) => (
            <span key={idx} className={"aula-slider__bar" + (idx <= i ? " is-on" : "")}></span>
          ))}
        </div>
        <div className="aula-slider__counter">{i + 1} / {max}</div>
      </div>
      <div className="aula-slider__frame">
        <div className="aula-slider__track" style={{ transform: `translateX(-${i * 100}%)` }}>
          {steps.map((s, idx) => (
            <div key={idx} className="aula-slider__slide">
              <SliderMarker step={s} index={idx} />
              <RichInline className="aula-slider__title" value={s.title} />
              <RichContent className="aula-slider__text" html={s.body} />
            </div>
          ))}
        </div>
      </div>
      <div className="aula-slider__controls">
        <button
          type="button"
          className="aula-slider__btn"
          onClick={() => setI((v) => Math.max(0, v - 1))} disabled={i === 0}
        >
          <Icon name="chevron-left" size={16} stroke={2} />
          <span>Anterior</span>
        </button>
        <button
          type="button"
          className="aula-slider__btn aula-slider__btn--primary"
          onClick={() => setI((v) => Math.min(max - 1, v + 1))} disabled={i === max - 1}
        >
          <span>{i === max - 1 ? "Concluído" : "Próximo"}</span>
          <Icon name="chevron-right" size={16} stroke={2} />
        </button>
      </div>
    </div>
  );
}

// ACCORDION — vertical stack of collapsibles
function Accordion({ items = [], renderBlocks }) {
  if (usePDF()) {
    // PDF: every item open, question + answer visible.
    return (
      <div className="aula-accordion-print">
        {items.map((it, idx) => {
          const title = it.title != null ? it.title : it.q;
          const body = it.body != null ? it.body : it.a;
          return (
          <div key={idx} className="aula-card aula-accordion-print__item">
            <div className="aula-accordion-print__row">
              <span className="aula-acc__num">{String(idx + 1).padStart(2, "0")}</span>
              <div>
                <RichContent className="aula-accordion-print__q" html={title} />
                <RichContent className="aula-accordion-print__a" html={body} />
                {renderBlocks && renderBlocks(it.children || [])}
              </div>
            </div>
          </div>
          );
        })}
      </div>
    );
  }
  const [open, setOpen] = useState(0);
  return (
    <div className="aula-accordion">
      {items.map((it, idx) => {
        const isOpen = open === idx;
        const title = it.title != null ? it.title : it.q;
        const body = it.body != null ? it.body : it.a;
        return (
          <div key={idx} className={"aula-acc__item" + (isOpen ? " is-open" : "")}>
            <button
              type="button"
              className="aula-acc__head"
              onClick={() => setOpen(isOpen ? -1 : idx)}
              aria-expanded={isOpen}
            >
              <span className="aula-acc__num">{String(idx + 1).padStart(2, "0")}</span>
              <RichContent className="aula-acc__q" html={title} tag="span" />
              <span className="aula-acc__chev">
                <Icon name="chevron-down" size={20} stroke={1.6} />
              </span>
            </button>
            <div className="aula-acc__bodywrap">
              <div className="aula-acc__clip">
                <RichContent className="aula-acc__body" html={body} />
                {renderBlocks && renderBlocks(it.children || [])}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// QUIZ — multiple questions, single-choice, submit + nova tentativa
function Quiz({ title = "Quiz", intro, questions = [], passMark = 0.6, avaliativo = false, pdfGabarito = true }) {
  if (usePDF()) {
    // PDF: questions stay clean; the compact answer key follows the activity.
    return (
      <section className="aula-card aula-quiz-print" aria-label="Quiz">
        <div className="aula-quiz__kicker aula-kicker">
          <Icon name="graduation-cap" size={16} stroke={1.8} color="var(--ink-mute)" />
          <RichInline value={title}/>
        </div>
        {intro && <RichContent className="aula-quiz__intro" html={intro} />}
        <ol className="aula-quiz-print__list">
          {questions.map((q, qi) => (
            <li key={qi} className="aula-quiz-q">
              <div className="aula-quiz__qhead">
                <span className="aula-quiz__qnum">{qi + 1}</span>
                <RichContent className="aula-quiz__qtext" html={q.q} />
              </div>
              <ul className="aula-quiz-print__options">
                {q.options.map((opt, oi) => {
                  return (
                    <li key={oi} className="aula-quiz-print__opt">
                      <span className="aula-quiz-print__letter">{String.fromCharCode(97 + oi) + ")"}</span>
                      <RichInline className="aula-quiz-print__opt-text" value={opt}/>
                    </li>
                  );
                })}
              </ul>
            </li>
          ))}
        </ol>
        {pdfGabarito && questions.length > 0 && (
          <aside className="aula-quiz-print__answer-key" aria-label="Gabarito e feedback">
            <h3>Gabarito e feedback</h3>
            <ol>
              {questions.map((q, qi) => (
                <li key={qi}>
                  <strong>{qi + 1}. {String.fromCharCode(65 + q.answer)}</strong>
                  {q.explanation && <RichContent className="aula-quiz-print__answer-text" html={q.explanation} />}
                </li>
              ))}
            </ol>
          </aside>
        )}
      </section>
    );
  }
  const [answers, setAnswers] = useState(() => questions.map(() => -1));
  const [submitted, setSubmitted] = useState(false);
  const [attempt, setAttempt] = useState(1);

  const total = questions.length;
  const correct = answers.reduce((n, a, i) => n + (a === questions[i].answer ? 1 : 0), 0);
  const ratio = total ? correct / total : 0;
  const threshold = Number(passMark) > 1 ? Number(passMark) / 10 : Number(passMark);
  const passed = ratio >= Math.max(0, Math.min(1, threshold || 0));
  const answeredAll = answers.every((a) => a >= 0);

  const choose = (qi, oi) => {
    if (submitted) return;
    setAnswers((prev) => prev.map((v, i) => (i === qi ? oi : v)));
  };
  const submit = () => {
    if (!answeredAll) return;
    setSubmitted(true);
    // Avaliativo: report the grade to the LMS on a 0–10 scale.
    if (avaliativo && window.AulaSCORM && typeof window.AulaSCORM.score === "function") {
      const nota10 = total ? Math.round((correct / total) * 10 * 10) / 10 : 0; // 0–10, 1 decimal
      try { window.AulaSCORM.score(nota10, passed); } catch (e) { /* noop */ }
    }
  };
  const retry = () => { setAnswers(questions.map(() => -1)); setSubmitted(false); setAttempt((a) => a + 1); };

  return (
    <section className="aula-quiz" aria-label="Quiz">
      <div className="aula-quiz__head">
        <span className="aula-quiz__kicker aula-kicker">
          <Icon name="graduation-cap" size={16} stroke={1.8} color="var(--ink-mute)" />
          <RichInline value={title}/>
        </span>
        <span className="aula-quiz__attempt">Tentativa {attempt}</span>
      </div>
      {intro && <RichContent className="aula-quiz__intro" html={intro} />}

      <ol className="aula-quiz__list">
        {questions.map((q, qi) => {
          const chosen = answers[qi];
          return (
            <li key={qi} className="aula-quiz__q">
              <div className="aula-quiz__qhead">
                <span className="aula-quiz__qnum">{qi + 1}</span>
                <RichContent className="aula-quiz__qtext" html={q.q} />
              </div>
              <div className="aula-quiz__options">
                {q.options.map((opt, oi) => {
                  const isChosen = chosen === oi;
                  const isAnswer = q.answer === oi;
                  let state = "idle";
                  if (submitted) {
                    if (isAnswer) state = "correct";
                    else if (isChosen) state = "wrong";
                  } else if (isChosen) state = "chosen";
                  return (
                    <button
                      key={oi}
                      type="button"
                      className="aula-quiz__opt"
                      data-state={state}
                      onClick={() => choose(qi, oi)}
                      disabled={submitted}
                      aria-pressed={isChosen}
                    >
                      <span className="aula-quiz__radio" data-state={state}>
                        {submitted && isAnswer && <Icon name="check" size={13} stroke={3} color="var(--paper)" />}
                        {submitted && isChosen && !isAnswer && <Icon name="x" size={13} stroke={3} color="var(--paper)" />}
                        {!submitted && isChosen && <span className="aula-quiz__radio-dot"></span>}
                      </span>
                      <RichInline className="aula-quiz__opt-text" value={opt}/>
                    </button>
                  );
                })}
              </div>
              {submitted && q.explanation && (
                <div className={"aula-quiz__explain" + (chosen === q.answer ? " is-ok" : " is-no")}>
                  <Icon name={chosen === q.answer ? "check-circle" : "alert-triangle"} size={15} stroke={1.9}
                        color={chosen === q.answer ? "var(--sage-deep)" : "var(--terracotta-deep)"} />
                  <RichContent html={q.explanation} />
                </div>
              )}
            </li>
          );
        })}
      </ol>

      <div className="aula-quiz__footer">
        {!submitted ? (
          <React.Fragment>
            <span className="aula-quiz__progress">
              {answers.filter((a) => a >= 0).length} de {total} respondidas
            </span>
            <button
              type="button"
              className="aula-quiz__submit"
              onClick={submit} disabled={!answeredAll}
            >
              Verificar respostas
              <Icon name="check" size={16} stroke={2.2} color="var(--paper)" />
            </button>
          </React.Fragment>
        ) : (
          <div className="aula-quiz__result">
            <div className={"aula-quiz__score" + (passed ? " is-pass" : " is-fail")}>
              <span className="aula-quiz__score-num">{correct}/{total}</span>
              <span className="aula-quiz__score-label">
                {avaliativo
                  ? `Nota ${(total ? Math.round((correct / total) * 100) / 10 : 0).toLocaleString("pt-BR")} \u2014 ${passed ? "aprovado" : "n\u00e3o atingiu a nota m\u00ednima"}`
                  : (passed ? "Voc\u00ea foi bem!" : "Vale revisar e tentar de novo")}
              </span>
            </div>
            <button type="button" className="aula-quiz__retry" onClick={retry}>
              <Icon name="refresh-cw" size={16} stroke={2} color="var(--ink)" />
              Nova tentativa
            </button>
          </div>
        )}
      </div>
    </section>
  );
}

// LINHA DO TEMPO — interativa, organizada em eras (períodos).
// Cada era tem rótulo + intervalo + cor (tone). Dentro dela,
// marcos por data; clicar abre texto e imagem opcional.
function LinhaDoTempo({ eras = [], title, renderBlocks }) {
  const pdf = usePDF();
  return (
    <div className="aula-timeline">
      {title && <RichInline className="aula-tl-toptitle" value={title}/>}
      {eras.map((era, ei) => {
        const tone = AULA_TONES[era.tone] || AULA_TONES.ocean;
        return (
          <section className="aula-tl-era" key={ei} style={{ "--tl-base": tone.base, "--tl-soft": tone.soft, "--tl-deep": tone.deep }}>
            <header className="aula-tl-era-head">
              <span className="aula-tl-era-dot" aria-hidden="true"></span>
              <RichInline className="aula-tl-era-label" value={era.label}/>
              {era.range && <RichInline className="aula-tl-era-range" value={era.range}/>}
            </header>
            <ol className="aula-tl-events">
              {(era.events || []).map((ev, vi) => (
                <TimelineEvent key={vi} ev={ev} defaultOpen={!!ev.open} print={pdf} renderBlocks={renderBlocks} />
              ))}
            </ol>
          </section>
        );
      })}
    </div>
  );
}

function TimelineEvent({ ev, defaultOpen = false, print = false, renderBlocks }) {
  const [open, setOpen] = useState(!!defaultOpen);
  const hasImg = !!(ev.src || ev.slotId);
  const hasDetail = !!(ev.text || hasImg || (ev.children || []).length);
  const detailContent = hasDetail && (
    <React.Fragment>
      {hasImg && (
        <div className="aula-tl-img">
          {ev.src
            ? <img src={ev.src} alt={richPlain(ev.title)} />
            : <image-slot id={ev.slotId || "tl-img"} shape="rect" placeholder={richPlain(ev.title) || "Imagem do marco"} style={{ width: "100%", height: "100%" }}></image-slot>}
        </div>
      )}
      {ev.text && <RichContent className="aula-tl-text" html={ev.text}/>}
      {renderBlocks && renderBlocks(ev.children || [])}
    </React.Fragment>
  );
  if (print) {
    return (
      <li className="aula-tl-event aula-tl-event--print is-open">
        <div className="aula-tl-marker aula-tl-marker--print">
          <span className="aula-tl-dot" aria-hidden="true"></span>
          <span className="aula-tl-mk-main">
            <RichInline className="aula-tl-date" value={ev.date}/>
            <RichInline className="aula-tl-title" value={ev.title}/>
          </span>
        </div>
        {hasDetail && <div className="aula-tl-detail">{detailContent}</div>}
      </li>
    );
  }
  return (
    <li className={"aula-tl-event" + (open ? " is-open" : "")}>
      <button type="button" className="aula-tl-marker" onClick={() => hasDetail && setOpen((o) => !o)} aria-expanded={open} disabled={!hasDetail}>
        <span className="aula-tl-dot" aria-hidden="true"></span>
        <span className="aula-tl-mk-main">
          <RichInline className="aula-tl-date" value={ev.date}/>
          <RichInline className="aula-tl-title" value={ev.title}/>
        </span>
        {hasDetail && (
          <span className="aula-tl-chev" aria-hidden="true">
            <Icon name="chevron-down" size={18} stroke={1.7} color="var(--ink-mute)" />
          </span>
        )}
      </button>
      {hasDetail && (
        <div className="aula-tl-detailwrap">
          <div className="aula-tl-clip">
            <div className="aula-tl-detail">
              {detailContent}
            </div>
          </div>
        </div>
      )}
    </li>
  );
}

// DADOS & CONTEÚDO — tabela, cases, features, materiais,

// TABELA — striped, otimizada para mobile.
//   No desktop: tabela normal com zebra striping discreto.
//   No mobile (<600px): cada linha vira um cartão e cada célula
//   exibe o rótulo da sua coluna (via data-label). Sem scroll-x.
function Tabela({ caption, fonte, headers = [], rows = [], striped = true, destacarPrimeira = true, compact = false }) {
  const cls = [
    "aula-tabela",
    striped ? "aula-tabela--striped" : "",
    compact ? "aula-tabela--compact" : "",
    destacarPrimeira ? "aula-tabela--rowhead" : "",
  ].filter(Boolean).join(" ");
  return (
    <figure className="aula-tabela-wrap">
      <table className={cls} style={{ "--table-columns": Math.max(headers.length, 1) }}>
        {caption && <caption className="aula-tabela-caption"><RichInline value={caption}/></caption>}
        <thead>
          <tr>
            {headers.map((h, i) => <th key={i} scope="col"><RichInline value={h}/></th>)}
          </tr>
        </thead>
        <tbody>
          {rows.map((r, ri) => (
            <tr key={ri}>
              {r.map((cell, ci) =>
                ci === 0 && destacarPrimeira ? (
                  <th key={ci} scope="row" data-label={richPlain(headers[ci])}><RichInline value={cell}/></th>
                ) : (
                  <td key={ci} data-label={richPlain(headers[ci])}><RichInline value={cell}/></td>
                )
              )}
            </tr>
          ))}
        </tbody>
      </table>
      {fonte && <figcaption className="aula-tabela-fonte"><RichInline value={fonte}/></figcaption>}
    </figure>
  );
}

// CASE CARDS — cover image + title + short text
function CaseCards({ title, intro, cards = [], columns = 2, layout = "vertical" }) {
  const horizontal = layout === "horizontal";
  const cols = String(columns) === "3" ? "3" : "2";
  const mediaType = (card) => card.mediaType || card.media || "image";
  return (
    <section className="aula-cases">
      {title && <RichInline className="aula-cases__title" value={title} />}
      {intro && <RichContent className="aula-cases__intro" html={intro} />}
      <div className={"aula-cases-grid" + (horizontal ? " is-horizontal" : "")} data-cols={cols}>
        {cards.map((c, i) => {
          const kind = mediaType(c);
          return (
            <div key={i} className={"aula-case-card" + (kind === "none" ? " is-text-only" : "")}>
              {kind !== "none" && (
                <div className={"aula-case-cover" + (kind === "icon" ? " is-icon" : "")}>
                  {kind === "icon" ? (
                    <i className={`fa-solid fa-${c.icon || "lightbulb"}`} aria-hidden="true"></i>

//   ordem="texto-imagem" | "imagem-texto" · largura ex. "46%" · sangria ex. "8%"
function TextoImagem({ children, texto, src, slotId, legenda, fonte, ordem = "texto-imagem", largura = "46%", sangria = "8%" }) {
  const imgLeft = ordem === "imagem-texto";
  const pdf = usePDF();
  const cls = [
    "aula-texto-imagem",
    imgLeft ? "aula-ti--img-left" : "aula-ti--img-right",
    pdf ? "aula-ti--pdf" : "",
  ].filter(Boolean).join(" ");
  const style = { "--ti-w": largura, "--ti-bleed": "-" + sangria };

  const figura = (
    <figure className="aula-ti-fig">

        ? <img className="aula-ti-img" src={src} alt={richPlain(legenda)} />

// LESSON COMPLETE — single SCORM-completion CTA.
// Calls window.AulaSCORM.complete() which sets completion +
// success status. No prev/next nav — the host LMS owns navigation.
function LessonComplete({ onComplete }) {
  if (usePDF()) return null; // the SCORM “mark complete” CTA has no meaning on paper
  const [done, setDone] = useState(false);
  const handle = () => {
    let ok = false;
    try {
      if (window.AulaSCORM && typeof window.AulaSCORM.complete === "function") {
        ok = window.AulaSCORM.complete();
      }
    } catch (e) { /* noop */ }
    setDone(true);
    if (onComplete) onComplete(ok);
  };
  return (
    <section className="aula-complete">
      <div className="aula-complete__inner">
        <div className={"aula-complete__ring" + (done ? " is-done" : "")}>
          <Icon name={done ? "check" : "award"} size={26} stroke={2} color={done ? "var(--paper)" : "var(--sage-deep)"} />
        </div>
        <h2 className="aula-complete__title">
          {done ? "Aula concluída — bom trabalho!" : "Você chegou ao fim desta aula"}
        </h2>
        <p className="aula-complete__sub">
          {done
            ? "Seu progresso foi registrado na plataforma."
            : "Ao marcar como concluída, sua conclusão deste conteúdo é registrada na plataforma."}
        </p>
        <button
          type="button"
          className={"aula-complete__btn" + (done ? " is-done" : "")}
          onClick={done ? undefined : handle}
          disabled={done}
        >
          {done ? "Aula concluída" : "Marcar aula como concluída"}
          <Icon name="check" size={18} stroke={2} color="var(--paper)" />
        </button>
      </div>
    </section>
  );
}

{"meta":{"title":"Álgebra e cálculo relacional: a base formal das consultas e a segurança de expressões","courseTitle":"Processamento de Consultas em Banco de Dados","weekNumber":1,"weekLabel":"Semana 1","calendarStartDate":"","calendarEndDate":"","author":"Rogerio Goncalves Bittencourt","role":"","institution":"IFSC","year":"2026","license":"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br","aiTool":"ClassAuthor (INOVALAB - IFSC)","aiUse":"Conteúdo elaborado com ClassAuthor, uma ferramenta de planejamento pedagógico desenvolvida por Rogério Bittencourt, INOVALAB - IFSC.","generatedBy":"Conteúdo elaborado com ClassAuthor, uma ferramenta de planejamento pedagógico desenvolvida por Rogério Bittencourt, INOVALAB - IFSC."},"blocks":[{"id":"b-hero-1-001","type":"hero","bg":"neutral-default","pad":"normal","props":{"eyebrow":"SEMANA 1","title":"Álgebra e cálculo relacional: a base formal das consultas e a segurança de expressões: Semana 1","lead":"Explicar por que a independência de dados e a equivalência formal entre expressões são a condição de existência do otimizador, e o papel do fechamento da álgebra relacional.","author":"Rogerio Goncalves Bittencourt","authorImage":"","readTime":"4 h de estudo","date":"2026"}},{"id":"b-topic-1-002","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-welcome-1-001","type":"prose","props":{"body":"<p>Imagine que você abre o sistema acadêmico do seu campus e pede a lista de estudantes reprovados em Cálculo II no último semestre. A resposta chega em milissegundos. Entre o seu pedido e a resposta, porém, alguém decidiu qual índice usar, em que ordem juntar as tabelas e quantas leituras de disco valia a pena arriscar. Esse alguém é um programa, o otimizador, e este curso trata do que ele faz.</p><p>Em quatro semanas vamos sair da linguagem formal em que as consultas são descritas e chegar ao plano que um SGBD real escolhe, passando por árvores de consulta, heurísticas e custos. Esta primeira semana, de abertura, constrói o vocabulário: álgebra relacional, cálculo relacional e a noção de segurança de expressões. Sem esse vocabulário, o resto do curso vira decoreba de saída do EXPLAIN.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-objectives-1-002","type":"destaque","props":{"title":"Objetivos de aprendizagem","body":"<ul><li>Explicar por que a independência de dados e a equivalência formal entre expressões são a condição de existência do otimizador, e o papel do fechamento da álgebra relacional.</li><li>Formalizar consultas em álgebra relacional e cálculo relacional (tuplas e domínios), identificando o poder expressivo de cada formalismo e a noção de segurança de expressões.</li><li>Aplicar álgebra relacional, cálculo relacional e SQL a uma situação concreta do contexto de Estudantes de Graduação em Ciência da Computação, como a consulta do tipo \"para todo\" no esquema universitário.</li><li>Avaliar limites e interpretações alternativas dos formalismos: conjuntos versus multiconjuntos e nulos, o fecho transitivo e o divisor vazio.</li></ul>","tone":"sage","icon":""}},{"id":"c-title-1-003","type":"titulo","props":{"text":"1 Pergunta e contexto: por que uma consulta precisa de formalismo antes de ter otimizador","level":"h2"}},{"id":"c-prose-1-021-p0","type":"prose","props":{"body":"<p>Comece pelo incômodo. Quando você escreve `SELECT ... FROM ... WHERE`, não diz ao banco onde os dados estão gravados, se deve usar um índice ou em que ordem cruzar as tabelas. Hoje isso parece natural, mas nem sempre foi assim. Até o fim dos anos 1960, os sistemas dominantes eram o IMS, da IBM (modelo hierárquico), e os que seguiam as propostas do grupo CODASYL (modelo de rede). Em ambos, o programador <strong>navegava</strong> pelos dados: abria o registro-pai, seguia um ponteiro até o primeiro filho e percorria a cadeia até achar o que queria. O programa carregava dentro de si o mapa físico dos dados. Acrescentar um índice, reordenar registros ou trocar a estrutura de ponteiros podia quebrar aplicações inteiras.</p><p>Em 1970, E. F. Codd, que trabalhava no laboratório de pesquisa da IBM em San Jose, publicou na <em>Communications of the ACM</em> o artigo \"A Relational Model of Data for Large Shared Data Banks\". A proposta era representar os dados como <strong>relações</strong>, que são conjuntos de tuplas, e deixar o caminho de acesso a cargo do sistema. O que ele buscava tem nome: <strong>independência de dados</strong> (<em>data independence</em>), a capacidade de mudar a organização física dos dados, e em certa medida a lógica, sem reescrever os programas que os usam. O artigo discute justamente as dependências de ordenação, de indexação e de caminho de acesso que o modelo pretendia eliminar.</p><p>Pense no que isso implica. Se o programa já diz <em>como</em> chegar aos dados, não sobra nada para o sistema escolher. Só quando a consulta diz <em>o que</em> se quer é que o sistema ganha liberdade para decidir o caminho. É como pedir um táxi: você informa o destino e deixa o motorista escolher as ruas, em vez de ditar cada curva. <strong>A independência de dados é a condição de existência do otimizador: sem uma consulta declarativa, não há plano a escolher.</strong></p><p>Há uma consequência menos óbvia. Para escolher entre vários caminhos, o sistema precisa de uma representação da consulta sobre a qual possa raciocinar, e precisa saber demonstrar que dois caminhos diferentes produzem exatamente o mesmo resultado. É aí que entra o formalismo. Sem semântica precisa, a palavra \"equivalente\" não significa nada, e sem equivalência o otimizador seria uma coleção de palpites. Por isso a álgebra e o cálculo, que parecem exercício de lógica, são a fundação do que o SGBD faz por baixo.</p><p>O caminho de uma consulta dentro de um SGBD pode ser resumido em quatro etapas, que o desenho a seguir organiza e a tabela detalha:</p>","dropcap":true,"dropcapTone":"terracotta"}},{"id":"c-prose-1-021-t0","type":"tabela","props":{"caption":"","fonte":"","striped":true,"destacarPrimeira":true,"compact":false,"headers":["Etapa","O que faz"],"rows":[["Consulta","Texto em SQL, que descreve o resultado desejado"],["Parser","Verifica sintaxe e nomes (consultando o catálogo) e produz uma representação interna, tipicamente uma expressão da álgebra relacional"],["Otimizador","Gera planos equivalentes, estima o custo de cada um e escolhe um"],["Executor","Roda o plano escolhido, com algoritmos concretos de seleção, junção e ordenação"]]}},{"id":"c-prose-1-021-p1","type":"prose","props":{"body":"<p>A figura e a tabela mostram que a álgebra relacional aparece duas vezes: o parser a usa como forma interna da consulta, e o otimizador a usa como linguagem em que escreve e reescreve os planos. Na Semana 2 vamos ver como o SQL vira uma árvore de operadores algébricos. Hoje, o importante é entender por que a álgebra serve a esse papel: ela tem semântica precisa, e é isso que permite afirmar que dois planos diferentes devolvem o mesmo resultado.</p><p>A ideia de que o sistema deve escolher o caminho não ficou no papel. Nos anos 1970, o projeto System R, no laboratório de pesquisa da IBM em San Jose, construiu um dos primeiros protótipos de grande porte de um SGBD relacional, com a linguagem que viria a ser o SQL e, o que mais interessa a nós, um otimizador que escolhia caminhos de acesso com base em estimativas de custo. A Semana 4 volta a esse trabalho, em uma leitura obrigatória. Nesta semana basta guardar o fato histórico: a promessa de Codd só virou produto, em boa medida, quando alguém mostrou que o sistema conseguia escolher bem sozinho. Se escolhesse mal, o programador voltaria a navegar à mão, e a independência de dados seria só uma bela frase.</p><p>Vale então desenhar o percurso do curso inteiro, já que esta é a abertura. Na <strong>Semana 1</strong> construímos a linguagem: álgebra relacional, cálculo relacional e segurança de expressões. Na <strong>Semana 2</strong> traduzimos entre os formalismos e o SQL, e convertemos consultas em árvores de álgebra, aplicando regras de equivalência. Na <strong>Semana 3</strong> usamos essas regras como heurísticas: antecipar seleções e projeções, escolher a ordem das junções. Na <strong>Semana 4</strong> entram os números, isto é, estatísticas do catálogo, seletividade, cardinalidade e custo de E/S, para comparar algoritmos de seleção e de junção e analisar o plano de um SGBD real. Cada semana usa a anterior como ferramenta, e a pergunta que nos guia agora é: <strong>que conceitos e que vocabulário precisamos para descrever uma consulta de forma tão precisa que uma máquina possa raciocinar sobre ela?</strong></p><p>Há um limite a registrar desde já. Formalismo não é garantia de realismo. A álgebra trata relações como conjuntos, sem duplicatas e sem nulos, e o SQL que vocês escrevem todo dia trabalha com <em>multiconjuntos</em> (<em>bags</em>) e com lógica de três valores. Essa distância é pequena o bastante para a álgebra continuar útil e grande o bastante para morder quem a ignora. Voltaremos a ela, com cuidado, na Semana 2.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-destaque-1-001","type":"destaque","props":{"title":"Em uma frase","body":"<p>a independência de dados é o que transforma \"executar uma consulta\" em \"escolher entre vários planos equivalentes\".</p>","tone":"sage","icon":""}},{"id":"c-reflexao-1-002","type":"reflexao","props":{"title":"Para refletir (não vale nota)","question":"qual consulta do sistema acadêmico do seu campus você saberia escrever, mas não saberia dizer como o SGBD a executa? Anote a consulta: ela pode virar o seu objeto de estudo no estudo de caso da Semana 4.","body":"","tone":"lavender","icon":""}},{"id":"c-title-1-004","type":"titulo","props":{"text":"2 Álgebra relacional: operadores e fechamento","level":"h2"}},{"id":"c-prose-1-022-p0","type":"prose","props":{"body":"<p>Uma <strong>relação</strong> é um conjunto de tuplas, todas com o mesmo conjunto de atributos. O <strong>esquema</strong> da relação dá o nome dela e a lista dos atributos, cada um com seu <strong>domínio</strong> (o conjunto de valores que o atributo pode assumir: inteiros, textos, datas), como em <em>instructor(ID, name, dept_name, salary)</em>. A <strong>chave</strong> é um conjunto mínimo de atributos que identifica cada tupla sem ambiguidade; aqui, <em>ID</em>. Como relação é conjunto, não há ordem entre as tuplas e não há duas tuplas iguais. Guarde essas duas propriedades, porque são elas que o SQL desrespeita.</p><p>Para os exemplos usaremos o esquema universitário clássico de Silberschatz, Korth e Sudarshan: <em>instructor(ID, name, dept_name, salary)</em>, <em>department(dept_name, building, budget)</em>, <em>course(course_id, title, dept_name, credits)</em> e <em>teaches(ID, course_id, sec_id, semester, year)</em>. Confiram na edição adotada se os nomes e os valores coincidem; a lógica independe disso.</p><p>A <strong>álgebra relacional</strong> é uma coleção de operadores que recebem uma ou duas relações e devolvem uma relação. Os operadores fundamentais e os principais derivados cabem em uma tabela:</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-1-022-t0","type":"tabela","props":{"caption":"","fonte":"","striped":true,"destacarPrimeira":true,"compact":false,"headers":["Operador","Símbolo","O que faz"],"rows":[["Seleção","σ_P(r)","Mantém as tuplas que satisfazem o predicado P"],["Projeção","π_A(r)","Mantém só os atributos A, eliminando duplicatas"],["União","r ∪ s","Tuplas que estão em r ou em s"],["Diferença","r − s","Tuplas de r que não estão em s"],["Produto cartesiano","r × s","Todas as combinações de uma tupla de r com uma de s"],["Renomeação","ρ_x(r)","Dá novo nome à relação ou aos atributos"],["Junção natural","r ⋈ s","Produto seguido de seleção por igualdade nos atributos de mesmo nome, com projeção que remove a coluna repetida"],["Junção theta","r ⋈_θ s","σ_θ(r × s)"],["Interseção","r ∩ s","r − (r − s)"],["Divisão","r ÷ s","Valores de r associados a todas as tuplas de s"]]}},{"id":"c-prose-1-022-p1","type":"prose","props":{"body":"<p>Observe o que a tabela revela. Os seis primeiros operadores bastam; os demais são abreviações que se escrevem com eles, como a interseção, que é duas diferenças, e a junção theta, que é um produto seguido de seleção. Isso não é preciosismo. Na Semana 3, quando estivermos otimizando, a equivalência \"seleção sobre produto = junção\" será uma das regras mais valiosas. A renomeação, por sua vez, parece decorativa até você precisar comparar um instrutor com outro da mesma relação: sem ρ, não há como distinguir as duas cópias de <em>instructor</em> dentro de uma mesma expressão.</p><p>União e diferença exigem <strong>compatibilidade de esquemas</strong>: as duas relações precisam ter o mesmo número de atributos, com domínios compatíveis. Não faria sentido unir uma lista de nomes com uma lista de salários. Já a propriedade central do conjunto é o <strong>fechamento</strong>: toda operação devolve uma relação, então qualquer saída pode ser entrada de outro operador. É ele que permite compor expressões arbitrariamente grandes, como quem monta uma frase a partir de peças que sempre se encaixam, e é ele que, na Semana 2, nos deixará desenhar essas expressões como árvores.</p><p>Vale notar uma sutileza de quem projeta sistemas. Dizer que seis operadores bastam é um resultado sobre <em>poder expressivo</em>, não sobre eficiência. Uma junção escrita como produto seguido de seleção é logicamente a mesma coisa que uma junção natural, mas um executor ingênuo que materializasse o produto inteiro gastaria memória e tempo absurdos. Os operadores derivados existem na álgebra por conveniência de notação e, em geral, nos SGBDs também porque o sistema pode reconhecer o padrão e escolher um algoritmo específico para ele. Guarde isso: <strong>a álgebra diz o que cada operador significa; quanto ele custa é outra conversa</strong>, que só começa na Semana 4.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-composition-1-2-pitaco-1","type":"pitaco","props":{"kicker":"Pitaco","name":"Olhar profissional","role":"Comentário de contexto","tone":"coral","src":"","slotId":"c-composition-1-2-pitaco-1","body":"<p>Retome álgebra relacional: operadores e fechamento e observe como isso aparece no problema analisado nesta seção.</p>"}},{"id":"c-composition-1-2-tabela-1","type":"tabela","props":{"caption":"Tabela comparativa: Álgebra relacional: operadores e fechamento","fonte":"Síntese da aula-base","striped":true,"destacarPrimeira":true,"compact":false,"headers":["Aspecto","O que observar","Pergunta"],"rows":[["Conceito","Álgebra relacional: operadores e fechamento","Como se define?"],["Aplicação","Contexto educacional","Que decisão orienta?"]]}},{"id":"c-subtitle-1-012","type":"titulo","props":{"text":"2.1 Um caso passo a passo: quem lecionou no outono de 2017","level":"h3"}},{"id":"c-subprose-1-014","type":"prose","props":{"body":"<p>Vamos formalizar a pergunta: **quais são os nomes dos instrutores que lecionaram alguma turma no semestre <em>Fall</em> de 2017?** Os dados de <em>instructor</em> e de <em>teaches</em> estão em relações separadas, ligadas pelo atributo <em>ID</em>, então precisamos juntá-las.</p><p>Passo 1: combinar as relações. <em>instructor</em> ⋈ <em>teaches</em> devolve uma relação com os atributos de ambas, em que cada tupla liga um instrutor a uma turma que ele ministrou. Passo 2: escolher as linhas. σ_{semester = 'Fall' ∧ year = 2017}(instructor ⋈ teaches) mantém só as turmas daquele semestre. Passo 3: escolher a coluna. π_{name}(σ_{semester = 'Fall' ∧ year = 2017}(instructor ⋈ teaches)) devolve uma relação de um só atributo. Pelo fechamento, a saída de cada passo entrou direto no operador seguinte. Como a projeção elimina duplicatas, um instrutor que deu três turmas no semestre aparece uma única vez.</p><p>Note ainda o que a junção natural fez sem ser pedida: como <em>instructor</em> e <em>teaches</em> compartilham apenas o atributo <em>ID</em>, a igualdade foi imposta só nele. Se as duas relações tivessem outro atributo de mesmo nome por acaso, a junção natural o igualaria também, e o resultado mudaria em silêncio. É por isso que muitos autores preferem a junção theta, em que a condição é escrita por extenso, ou usam ρ para evitar colisões de nomes. A lição é que <strong>a junção natural é conveniente porque decide por você, e esse é exatamente o seu risco</strong>.</p><p>Essa expressão é uma <strong>receita</strong>: diz</p><p>que operação fazer e em que ordem. Aí está também o limite da álgebra como forma de <em>pensar</em> uma consulta. Escrever a expressão acima exigiu decidir uma ordem: primeiro juntar, depois filtrar, depois projetar. Para uma consulta pequena, a ordem é óbvia. Para uma consulta com cinco junções, quem escreve já está, sem perceber, fazendo trabalho de otimizador, e talvez fazendo mal. Pense em como um estudante de segundo ano escreveria a mesma consulta filtrando antes de juntar, e em quanto trabalho isso poderia poupar. Mas então a ordem escrita importa para o desempenho, e a promessa de Codd, a de que o programador não precisa se preocupar com o caminho, parece ameaçada pela própria notação. E se pudéssemos descrever apenas as propriedades do resultado, sem prescrever nenhuma ordem de operações? É a pergunta que a próxima seção responde, trocando a receita por uma descrição lógica do que se quer.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-atencao-1-101","type":"atencao","props":{"title":"Atenção","body":"<p>confundir σ com π é o erro mais comum, e acontece porque o `SELECT` do SQL corresponde à projeção, não à seleção. Lembre: σ filtra linhas, π escolhe colunas. E, no modelo teórico, a projeção elimina duplicatas: dois instrutores com o mesmo nome produzem uma única linha. O SQL, por padrão, mantém as duas, a não ser que você peça `DISTINCT`.</p>","tone":"coral","icon":""}},{"id":"c-title-1-005","type":"titulo","props":{"text":"3 Cálculo relacional: tuplas e domínios","level":"h2"}},{"id":"c-prose-1-023","type":"prose","props":{"body":"<p>A álgebra da seção anterior tem um jeito próprio de pensar: você monta uma receita, passo a passo, e cada passo devolve uma relação. Agora vamos inverter a perspectiva. O <strong>cálculo relacional</strong> (<em>relational calculus</em>) é uma linguagem em que dizemos <em>quais tuplas</em> queremos usando lógica de primeira ordem (predicados, conectivos e quantificadores), sem dizer em que ordem as operações acontecem. Em vez de \"filtre, depois projete\", escrevemos \"devolva todo <em>t</em> tal que isto é verdade a respeito de <em>t</em>\". Relembrando a Seção 1, é a distinção entre dizer <em>o que</em> se quer e dizer <em>como</em> obtê-lo, agora com notação matemática. Há duas versões do formalismo, e a diferença entre elas é só sobre o que as variáveis percorrem: tuplas inteiras ou valores de atributos.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-composition-1-3-atencao-1","type":"atencao","props":{"title":"Atenção","body":"<p>Um erro comum é tratar cálculo relacional: tuplas e domínios como uma solução automática. Compare a explicação da seção com as condições concretas do contexto.</p>","tone":"coral","icon":""}},{"id":"c-composition-1-3-citacao-1","type":"citacao","props":{"quote":"A álgebra da seção anterior tem um jeito próprio de pensar: você monta uma receita, passo a passo, e cada passo devolve uma relação.","author":"Síntese da seção","source":"Aula-base · conferir fonte se for citação literal","showAttribution":true}},{"id":"c-composition-1-3-pitaco-2","type":"pitaco","props":{"kicker":"Pitaco","name":"Olhar profissional","role":"Comentário de contexto","tone":"coral","src":"","slotId":"c-composition-1-3-pitaco-2","body":"<p>Retome cálculo relacional: tuplas e domínios e observe como isso aparece no problema analisado nesta seção.</p>"}}]}},{"id":"b9muw96e","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-composition-1-3-feature-1","type":"feature","props":{"title":"O que observar em Cálculo relacional: tuplas e domínios","intro":"Use estes sinais para organizar a leitura.","align":"center","columns":3,"features":[{"icon":"lightbulb","tone":"ocean","title":"Ponto 1","text":"Relacione este ponto ao argumento sobre cálculo relacional: tuplas e domínios."},{"icon":"route","tone":"marigold","title":"Ponto 2","text":"Relacione este ponto ao argumento sobre cálculo relacional: tuplas e domínios."},{"icon":"check","tone":"sage","title":"Ponto 3","text":"Relacione este ponto ao argumento sobre cálculo relacional: tuplas e domínios."}]}},{"id":"c-subtitle-1-022","type":"titulo","props":{"text":"3.1 Cálculo relacional de tuplas","level":"h3"}},{"id":"c-subprose-1-024","type":"prose","props":{"body":"<p>No <strong>cálculo relacional de tuplas</strong>, uma consulta tem a forma {t | P(t)}: o conjunto de todas as tuplas <em>t</em> para as quais a fórmula <em>P</em> é verdadeira. A <strong>variável de tupla</strong> <em>t</em> percorre tuplas, o componente de um atributo se escreve <em>t</em>[A] e a pertinência a uma relação se escreve <em>t</em> ∈ <em>r</em>. As fórmulas combinam comparações com ∧, ∨ e ¬, além dos quantificadores ∃ (existe) e ∀ (para todo). Com o esquema universitário de Silberschatz, Korth e Sudarshan, os instrutores de Física com salário acima de 80 mil ficam assim:</p><p>{t | t ∈ instructor ∧ t[dept_name] = 'Physics' ∧ t[salary] &gt; 80000}</p><p>Não há σ nem ordem de execução. Para obter só os nomes, entra o quantificador: {t | ∃s ∈ instructor (t[name] = s[name] ∧ s[dept_name] = 'Physics' ∧ s[salary] &gt; 80000)}. A projeção aparece sem nenhum π: a tupla-resultado só tem o atributo <em>name</em>, e o ∃ exige uma \"testemunha\" <em>s</em> em <em>instructor</em> que satisfaça as condições.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-023","type":"titulo","props":{"text":"3.2 Cálculo relacional de domínios","level":"h3"}},{"id":"c-subprose-1-025","type":"prose","props":{"body":"<p>No <strong>cálculo relacional de domínios</strong>, as variáveis percorrem valores de atributos. A mesma consulta fica {⟨i, n, d, s⟩ | ⟨i, n, d, s⟩ ∈ instructor ∧ d = 'Physics' ∧ s &gt; 80000}. Para ficar só com os nomes, quantificamos as variáveis de que não queremos o valor: {⟨n⟩ | ∃i, d, s (⟨i, n, d, s⟩ ∈ instructor ∧ d = 'Physics' ∧ s &gt; 80000)}. O custo é a verbosidade, porque cada atributo pede uma variável. A vantagem é que a junção sai pela <em>repetição de variável</em>: se <em>i</em> aparece em <em>instructor</em> e em <em>teaches</em>, os dois ID coincidem, sem condição de junção explícita.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-024","type":"titulo","props":{"text":"3.3 Descendentes, quantificadores e o que \"declarativo\" quer dizer","level":"h3"}},{"id":"c5d66g95","type":"prose","props":{"body":"<p>Esses formalismos foram base de linguagens reais. A QUEL, do Ingres (Berkeley, anos 1970), descende do cálculo de tuplas: declara-se `range of i is instructor` e escreve-se `retrieve (i.name) where i.dept_name = \"Physics\"`. A Query-by-Example (QBE), de Moshé Zloof na IBM em meados dos anos 1970, é parente do cálculo de domínios: o usuário preenche uma grade com valores-exemplo, e o mesmo exemplo em duas tabelas expressa a junção. O SQL carrega esse DNA, pois `FROM instructor AS i` declara uma variável de tupla e `EXISTS` é o ∃ com outra roupa.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c42t81x2","type":"prose","props":{"body":"<p><span style=\"text-wrap-mode: initial;\">Os quantificadores merecem atenção porque a lógica dá duas ferramentas e o SQL entrega uma. Vale ∀x P(x) ≡ ¬∃x ¬P(x): \"todos satisfazem P\" é o mesmo que \"não existe quem deixe de satisfazer P\". Como o SQL tem `EXISTS` e não tem `FORALL`, consultas do tipo \"todos os...\" exigem o `NOT EXISTS (... NOT EXISTS ...)` aninhado. O que o cálculo diz numa linha, o SQL obriga a decifrar em duas camadas de negação.</span></p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subprose-1-026","type":"prose","props":{"body":"<p><span style=\"text-wrap-mode: initial;\">Em que sentido o cálculo é declarativo e a álgebra procedural? A álgebra descreve um </span><em style=\"text-wrap-mode: initial;\">caminho lógico</em><span style=\"text-wrap-mode: initial;\">: a árvore de operadores já carrega uma ordem. O cálculo descreve só o critério de pertinência. Cuidado com o exagero, porém: a expressão algébrica não diz se σ será varredura, índice ou hash, então ela é procedural apenas num nível alto. </span><strong style=\"text-wrap-mode: initial; color: rgb(27, 26, 23);\">O cálculo especifica o resultado; a álgebra especifica uma estratégia lógica; o executor escolhe a estratégia física.</strong><span style=\"text-wrap-mode: initial;\"> O limite é que declarativo não significa barato, nem calculável. Avaliar ∃ e ∀ ingenuamente exigiria percorrer todas as combinações possíveis de valores, e é essa explosão que obriga o cálculo a ser disciplinado. Se o cálculo descreve só o critério, o que impede alguém de escrever um critério que nenhuma relação finita consegue satisfazer? É a pergunta da próxima seção.</span></p>","dropcap":false,"dropcapTone":"terracotta"}}]}},{"id":"blm5p806","type":"pagebreak","bg":"neutral-default","pad":"tight","props":{}},{"id":"bfpkhasy","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-destaque-1-201","type":"destaque","props":{"title":"Em uma frase","body":"<p>o cálculo diz quais tuplas pertencem ao resultado, a álgebra diz que operações as produzem, e o SGBD traduz a primeira descrição na segunda e depois em algoritmos concretos.</p>","tone":"sage","icon":""}},{"id":"c-reflexao-1-202","type":"reflexao","props":{"title":"Para refletir (não vale nota)","question":"em qual das duas notações você erraria menos ao escrever \"alunos que cursaram todas as disciplinas de um semestre\"? Pense no que acontece se o semestre não tiver nenhuma disciplina cadastrada.","body":"","tone":"lavender","icon":""}},{"id":"c-title-1-006","type":"titulo","props":{"text":"4 Poder expressivo e segurança de expressões","level":"h2"}},{"id":"c-prose-1-024","type":"prose","props":{"body":"<p>Temos duas linguagens com sabores diferentes, e a pergunta é inevitável: uma delas diz coisas que a outra não consegue dizer? Se a resposta fosse \"sim\", teríamos de escolher a mais poderosa. Se fosse \"não\", poderíamos traduzir livremente de uma para a outra, e é essa liberdade que sustenta o processamento de consultas: o usuário escreve de forma declarativa, o sistema traduz para operadores. A resposta tem uma condição, e a condição tem nome: segurança.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-composition-1-4-citacao-2","type":"citacao","props":{"quote":"Temos duas linguagens com sabores diferentes, e a pergunta é inevitável: uma delas diz coisas que a outra não consegue dizer?","author":"Síntese da seção","source":"Aula-base · conferir fonte se for citação literal","showAttribution":true}},{"id":"c-composition-1-4-pitaco-3","type":"pitaco","props":{"kicker":"Pitaco","name":"Olhar profissional","role":"Comentário de contexto","tone":"coral","src":"","slotId":"c-composition-1-4-pitaco-3","body":"<p>Retome poder expressivo e segurança de expressões e observe como isso aparece no problema analisado nesta seção.</p>"}},{"id":"c-subtitle-1-032","type":"titulo","props":{"text":"4.1 O teorema de Codd e a completude relacional","level":"h3"}},{"id":"c-subprose-1-034","type":"prose","props":{"body":"<p>Em 1972, Codd publicou \"Relational Completeness of Data Base Sublanguages\", no volume <em>Data Base Systems</em> dos Courant Computer Science Symposia (Prentice-Hall). O resultado central é que a álgebra relacional e o cálculo relacional de tuplas <em>restrito a expressões seguras</em> têm o <strong>mesmo poder expressivo</strong>: toda consulta de um formalismo tem equivalente no outro. A prova é construtiva. Codd apresentou um algoritmo de redução que converte fórmulas do cálculo (na sua linguagem Alpha) em expressões algébricas, e a ideia geral é intuitiva: cada conectivo ou quantificador vira um operador. A conjunção vira junção ou interseção, a disjunção vira união, a negação vira diferença e o ∃ vira projeção, que \"esquece\" a variável testemunha. O ∀ entra pela equivalência ¬∃¬ que vimos na Seção 3. As versões seguras do cálculo de domínios também entram na equivalência, como apresentam Silberschatz, Korth e Sudarshan.</p><p>Dele nasceu um critério prático, a <strong>completude relacional</strong> (<em>relational completeness</em>): uma linguagem é relacionalmente completa se expressa pelo menos tudo o que a álgebra expressa. É um piso, não um teto. O SQL o cumpre com folga. Note a inversão de papéis: a álgebra, que parecia só mais uma linguagem, vira régua para medir qualquer outra, de uma API de grafos a um dialeto de documentos.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-033","type":"titulo","props":{"text":"4.2 Expressões inseguras e independência de domínio","level":"h3"}},{"id":"c-subprose-1-035","type":"prose","props":{"body":"<p>Por que a restrição? Considere {t | ¬(t ∈ instructor)}: \"todas as tuplas que <em>não</em> estão em <em>instructor</em>\". Sobre domínios infinitos, como inteiros e cadeias, há infinitas tuplas assim. A fórmula é sintaticamente correta e semanticamente inútil, porque o resultado é infinito e nenhum SGBD pode devolvê-lo. A álgebra nunca produz isso: a diferença exige uma relação de onde tirar, e r − s é sempre subconjunto de r. Uma expressão do cálculo é <strong>segura</strong> quando todo valor de seu resultado vem do <strong>domínio da expressão</strong>, isto é, dos valores que aparecem nas relações mencionadas ou como constantes na própria fórmula. A segurança é uma condição sintática, verificável, que garante resultado finito.</p><p>A noção semântica por trás dela é a <strong>independência de domínio</strong>: o resultado não pode depender de qual universo de valores se considera. Aqui há um limite honesto. Decidir se uma fórmula arbitrária é independente do domínio é, segundo a literatura da área, um problema indecidível, e por isso os livros trabalham com a segurança como condição suficiente, às vezes conservadora: algumas fórmulas perfeitamente boas ficam de fora. Abiteboul, Hull e Vianu tratam o tema em <em>Foundations of Databases</em>, e Date o apresenta em versão mais didática em <em>An Introduction to Database Systems</em>, ao discutir o que torna uma expressão do cálculo aceitável como consulta (capítulos e passagens exatas a conferir).</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-034","type":"titulo","props":{"text":"4.3 O que a álgebra e o cálculo não dizem","level":"h3"}},{"id":"c-subprose-1-036","type":"prose","props":{"body":"<p>Equivalência não é onipotência. A álgebra relacional básica não expressa o fecho transitivo (\"todos os pré-requisitos, diretos e indiretos, de uma disciplina\"), porque isso exigiria um número de junções que depende dos dados. Também não tem agregações nem ordenação, que são extensões. O SQL as incorpora (e consultas recursivas desde o SQL:1999), e por isso ultrapassa o piso de Codd. Esse é o contraponto: o piso é garantia mínima, não descrição do que o SQL faz hoje.</p><p>Há ainda um segundo limite, de outra natureza. O teorema de</p><p>Codd vale para relações tratadas como conjuntos, sem nulos, e é nessa moldura que ele é um teorema. O SQL que vocês escrevem trabalha com multiconjuntos e com lógica de três valores. Nela, uma comparação com `NULL` não é verdadeira nem falsa, é <em>desconhecida</em>, e o `WHERE` descarta tudo o que não é verdadeiro. Disso saem as armadilhas clássicas, como o `NOT IN` que devolve conjunto vazio porque a subconsulta contém um único `NULL`. Date, em suas críticas ao SQL, aponta esse afastamento do modelo relacional (obra e passagem a conferir). O resultado de Codd continua sendo a régua, mas a régua mede o modelo teórico, e a tradução para o SQL real precisa ser reconferida caso a caso. Voltamos a isso, com cuidado, na Semana 2.</p><p>Os dois limites têm origens diferentes. O primeiro é de <em>expressividade</em>: há perguntas razoáveis que o piso de Codd não alcança. O segundo é de <em>fidelidade</em>: há consultas que a álgebra alcança, mas cuja tradução para o SQL muda de sentido. Quem processa consultas precisa dos dois alertas, porque o otimizador reescreve expressões supondo que a equivalência é exata, e uma equivalência válida em conjuntos pode ser falsa em multiconjuntos com nulos.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-atencao-1-301","type":"atencao","props":{"title":"Atenção","body":"<p>\"seguro\" não quer dizer \"correto\", e \"equivalente\" não quer dizer \"idêntico no SQL\". Uma expressão segura garante apenas resultado finito, e não que ela responde à pergunta que você tinha em mente. E o teorema vale para conjuntos, sem nulos: ao levar uma consulta para o SQL, duplicatas, lógica de três valores e ordem entram em cena, e a equivalência precisa ser reconferida.</p>","tone":"coral","icon":""}},{"id":"c-title-1-007","type":"titulo","props":{"text":"5 Exemplo contextualizado: \"para todo\" e a divisão","level":"h2"}},{"id":"c-prose-1-025","type":"prose","props":{"body":"<p>Vamos juntar as peças com uma das consultas mais traiçoeiras do repertório, daquelas que costumam dar trabalho a quem está aprendendo banco de dados: <strong>quais estudantes cursaram todas as disciplinas de um determinado departamento?</strong> Usaremos o esquema universitário de Silberschatz, Korth e Sudarshan, agora com <em>student(ID, name, dept_name, tot_cred)</em> e <em>takes(ID, course_id, sec_id, semester, year)</em> ao lado de <em>course</em>, e como departamento, o de Biologia. No campus de vocês, a versão real seria \"quem cursou todas as disciplinas obrigatórias de um núcleo comum\". O \"todas\" é o que complica: ele quantifica sobre um conjunto que muda conforme os dados.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-042","type":"titulo","props":{"text":"5.1 Três escritas da mesma pergunta","level":"h3"}},{"id":"c-subprose-1-044-p0","type":"prose","props":{"body":"<p>A tabela mostra como cada formalismo diz \"todos\".</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subprose-1-044-t0","type":"tabela","props":{"caption":"","fonte":"","striped":true,"destacarPrimeira":true,"compact":false,"headers":["Formalismo","Como expressa \"para todo\""],"rows":[["Álgebra","Divisão r ÷ s, em que r relaciona estudantes a disciplinas cursadas e s lista as disciplinas exigidas"],["Cálculo","Quantificador ∀ sobre as disciplinas de Biologia"],["SQL","`NOT EXISTS` duplo, sem quantificador universal nativo"]]}},{"id":"c-subprose-1-044-p1","type":"prose","props":{"body":"<p>Na álgebra, definimos r = π_{ID, course_id}(takes) e s = π_{course_id}(σ_{dept_name = 'Biology'}(course)). A resposta é r ÷ s: os valores de <em>ID</em> associados a <em>todas</em> as tuplas de s. A divisão é derivada, e vale a pena ver de onde ela vem: r ÷ s = π_{ID}(r) − π_{ID}((π_{ID}(r) × s) − r). O raciocínio é o de um detetive. O produto π_{ID}(r) × s monta o mundo ideal em que todo estudante cursou toda disciplina de Biologia. Subtrair r deixa os pares estudante-disciplina que <em>faltam</em>. Projetar o ID fornece os estudantes com alguma falta, e a diferença final os remove do conjunto original. Repare que a álgebra não tem o \"todos\" como primitivo: ele é construído com produto, diferença e projeção, pela mesma dupla negação que o cálculo faz às claras.</p><p>No cálculo de tuplas, a leitura é literal: {t | ∃s ∈ student (t[ID] = s[ID] ∧ ∀u ∈ course (u[dept_name] = 'Biology' ⇒ ∃v ∈ takes (v[ID] = s[ID] ∧ v[course_id] = u[course_id])))}. Em palavras: o estudante <em>s</em> entra se, para toda disciplina <em>u</em> de Biologia, existe um registro em <em>takes</em> ligando <em>s</em> a <em>u</em>. Aplicando a equivalência da Seção 3, ∀x P(x) ≡ ¬∃x ¬P(x), e lembrando que A ⇒ B equivale a ¬A ∨ B, o ∀ vira \"não existe disciplina de Biologia que o estudante deixou de cursar\". O resultado é o que o SQL aceita:</p><p>```sql SELECT s.ID FROM student s WHERE NOT EXISTS ( SELECT c.course_id FROM course c WHERE c.dept_name = 'Biology' AND NOT EXISTS ( SELECT 1 FROM takes t WHERE t.ID = s.ID AND t.course_id = c.course_id)); ```</p><p>O `NOT EXISTS` externo é o ¬∃ sobre disciplinas, e o interno é o ¬∃ sobre os registros de matrícula. As duas negações são o ∀ desmontado. Note também que o `EXISTS` do SQL se contenta com <em>uma</em> linha de `takes`, enquanto a álgebra precisou da projeção sobre r para eliminar o efeito de várias turmas da mesma disciplina. A lição é que <strong>\"para todo\" nunca é primitivo em linguagem de consulta: é sempre uma dupla negação disfarçada</strong>, e reconhecer o padrão é metade do trabalho de traduzi-lo.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-043","type":"titulo","props":{"text":"5.2 Onde as três versões divergem: o divisor vazio","level":"h3"}},{"id":"c-subprose-1-045","type":"prose","props":{"body":"<p>Aqui o exemplo ensina algo que nenhum dos formalismos mostra sozinho. O que acontece se o departamento de Biologia não tiver nenhuma disciplina cadastrada? Em lógica, ∀ sobre um conjunto vazio é verdadeiro, o que os lógicos chamam de verdade vazia: ninguém deixou de cursar nada. A versão do cálculo e a do SQL, que percorrem <em>student</em>, devolvem então <em>todos</em> os estudantes, inclusive os que nunca se matricularam em coisa alguma. A divisão, pela definição que vimos, retira os candidatos de π_{ID}(r), isto é, só de quem aparece em <em>takes</em>, e por isso os estudantes sem nenhuma matrícula ficam de fora. Três escritas da \"mesma\" consulta, duas respostas diferentes, e nenhuma delas errada diante da própria definição.</p><p>Isso conecta com a distinção da Seção 2. A álgebra diz o que cada operador significa, e a equivalência entre formalismos vale <em>sob as mesmas hipóteses sobre o domínio de onde os candidatos saem</em>. Uma tradução fiel pede que se decida de onde vêm os candidatos (<em>student</em> ou <em>takes</em>), e não só como se quantifica. Para um otimizador, que reescreve ∀ em divisão ou em anti-junção, a mesma pergunta aparece como condição de validade da regra. Em tom de oficina: antes de acreditar numa reescrita, teste-a com o caso degenerado, a relação vazia.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-destaque-1-401","type":"destaque","props":{"title":"Em uma frase","body":"<p>\"todos\" é \"não existe quem falte\", e a divisão, o ∀ e o `NOT EXISTS` duplo são três maneiras de escrever essa mesma negação dupla, com um cuidado extra sobre quem são os candidatos.</p>","tone":"sage","icon":""}},{"id":"c-reflexao-1-402","type":"reflexao","props":{"title":"Para refletir (não vale nota)","question":"tome as disciplinas obrigatórias do primeiro ano do seu curso. Quais estudantes do seu campus \"cursaram todas\"? Escreva a consulta em `NOT EXISTS` duplo e depois responda: o que o seu sistema deveria devolver para o ingressante que ainda não se matriculou em nada?","body":"","tone":"lavender","icon":""}}]}},{"id":"bjiinf2y","type":"pagebreak","bg":"neutral-default","pad":"tight","props":{}},{"id":"b89oqzvn","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-glossary-1-002","type":"titulo","props":{"text":"Glossário rápido desta semana","level":"h2"}},{"id":"c-accordion-1-002","type":"accordion","props":{"items":[{"title":"Independência de dados","body":"<p>capacidade de alterar a organização física dos dados, e em certa medida a lógica, sem reescrever os programas que os usam. É a condição de existência do otimizador.</p>","children":[]},{"title":"Álgebra relacional","body":"<p>conjunto de operadores (σ, π, ∪, −, ×, ρ e derivados) que recebem relações e devolvem relações; descreve a consulta como uma receita com ordem lógica.</p>","children":[]},{"title":"Fechamento","body":"<p>propriedade pela qual toda operação da álgebra devolve uma relação, o que permite compor expressões arbitrariamente grandes.</p>","children":[]},{"title":"Cálculo relacional","body":"<p>linguagem baseada em lógica de primeira ordem que descreve quais tuplas pertencem ao resultado, sem prescrever ordem de operações; pode ser de tuplas ou de domínios.</p>","children":[]},{"title":"Divisão (r ÷ s)","body":"<p>operador derivado que devolve os valores de r associados a todas as tuplas de s; é a versão algébrica do \"para todo\".</p>","children":[]},{"title":"`NOT EXISTS` duplo","body":"<p>padrão SQL que expressa \"para todo\" por duas negações aninhadas, a partir de ∀x P(x) ≡ ¬∃x ¬P(x).</p>","children":[]},{"title":"Expressão segura","body":"<p>expressão do cálculo cujo resultado é finito e cujos valores vêm do domínio da expressão, isto é, das relações mencionadas e das constantes da fórmula.</p>","children":[]},{"title":"Independência de domínio","body":"<p>propriedade semântica de uma fórmula cujo resultado não depende do universo de valores considerado; decidi-la em geral é indecidível.</p>","children":[]},{"title":"Completude relacional","body":"<p>critério pelo qual uma linguagem de consulta é completa se expressa pelo menos tudo o que a álgebra relacional expressa.</p>","children":[]},{"title":"*Multiconjunto (bag)*","body":"<p>coleção que admite elementos repetidos; é o modelo de dados do SQL, distinto do conjunto da álgebra teórica.</p>","children":[]}]}}]}},{"id":"b-synthesis-1-001","type":"sintese","bg":"sage-deep","pad":"airy","props":{"eyebrow":"Síntese","title":"A ideia que fecha a semana","body":"<p>Voltemos à pergunta da semana: que vocabulário precisamos para descrever uma consulta com tanta precisão que uma máquina possa raciocinar sobre ela? A resposta começou em Codd (1970): se o programa diz <em>o que</em> quer e não <em>como</em> obtê-lo, o sistema ganha liberdade para escolher o caminho, e essa independência de dados é a condição de existência do otimizador. O System R mostrou que a escolha automática podia ser boa o bastante para virar produto. Para escolher entre caminhos, é preciso demonstrar que dois deles dão o mesmo resultado, e é isso que os formalismos entregam. A álgebra, com o esquema universitário e a consulta dos instrutores do outono de 2017, mostrou a consulta como receita de operadores que sempre devolvem relações, graças ao fechamento. O cálculo, como na consulta dos instrutores de Física, descreve apenas o critério de pertinência. O teorema de Codd (1972) une os dois: álgebra e cálculo seguro dizem as mesmas consultas, e a segurança é o que impede o cálculo de pedir resultados infinitos como {t | ¬(t ∈ instructor)}. A consulta do \"para todo\" amarrou tudo: divisão, ∀ e `NOT EXISTS` duplo são a mesma negação dupla.</p><p>O contraponto atravessa o conjunto. A equivalência vale para conjuntos sem nulos, e o SQL trabalha com multiconjuntos e lógica de três valores. A álgebra básica não alcança o fecho transitivo, e o divisor vazio mostrou que até a tradução de um ∀ depende de decisões sobre o domínio dos candidatos. Quanto ao custo dos planos (seletividade, cardinalidade, E/S), que o plano de curso coloca como objetivo, ele é o horizonte da Semana 4: aqui aprendemos a descrever e a comparar <em>significados</em>, e só depois vamos comparar <em>preços</em>. Sem o primeiro passo, o segundo não tem o que medir.</p><p><strong>Na próxima semana:</strong> O conceito que esta semana passa adiante é a <strong>equivalência semântica entre expressões</strong>: álgebra relacional e cálculo de tuplas seguro dizem as mesmas consultas (teorema de Codd), e uma expressão algébrica, graças ao fechamento, pode ser lida como uma árvore de operadores. A pergunta que fica em aberto é dupla. Como transformar mecanicamente um `SELECT ... FROM ... WHERE` em uma árvore algébrica? Até onde essa tradução continua fiel quando o SQL admite duplicatas, nulos e ordem, coisas que o modelo teórico não tem, e quando um \"todos\" depende de quais candidatos se consideram? Na Semana 2 você vai encontrar a tradução passo a passo entre álgebra, cálculo e SQL, com o mapa dos pontos em que o SQL se afasta do modelo relacional. Vai encontrar também a construção de árvores de consulta e as regras de equivalência algébrica, que justificam trocar uma árvore por outra sem alterar o resultado. É com essas regras que a heurística da Semana 3 vai trabalhar, e é com elas que, na Semana 4, os números de custo terão algo a comparar.</p>"}},{"id":"b-references-1-001","type":"referencias","bg":"accent-5-soft","pad":"normal","props":{"title":"Referências","items":["CODD, E. F. A relational model of data for large shared data banks. Communications of the ACM, v. 13, n. 6, p. 377-387, 1970.","CODD, E. F. Relational completeness of data base sublanguages. In: RUSTIN, R. (ed.). Data Base Systems. Englewood Cliffs: Prentice-Hall, 1972. p. 65-98. (Courant Computer Science Symposia, 6).","SILBERSCHATZ, A.; KORTH, H. F.; SUDARSHAN, S. Database System Concepts. 7. ed. New York: McGraw-Hill, 2019. (Capítulos sobre modelo relacional, álgebra relacional, cálculo relacional e SQL; usar a edição adotada.)","DATE, C. J. An Introduction to Database Systems. 8. ed. Boston: Addison-Wesley, 2004. (Capítulos sobre álgebra, cálculo e SQL; usar a edição adotada.)","ELMASRI, R.; NAVATHE, S. B. Fundamentals of Database Systems. 7. ed. Pearson, 2016. (Capítulos sobre álgebra e cálculo relacional; usar a edição adotada.)","ABITEBOUL, S.; HULL, R.; VIANU, V. Foundations of Databases. Reading: Addison-Wesley, 1995.","ASTRAHAN, M. M. et al. System R: relational approach to database management. ACM Transactions on Database Systems, v. 1, n. 2, p. 97-137, 1976.","STONEBRAKER, M. et al. The design and implementation of INGRES. ACM Transactions on Database Systems, v. 1, n. 3, p. 189-222, 1976.","ZLOOF, M. M. Query-by-Example: a data base language. IBM Systems Journal, v. 16, n. 4, p. 324-343, 1977.","SELINGER, P. G. et al. Access path selection in a relational database management system. In"]}},{"id":"b-credit-01","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-credit-01","type":"prose","props":{"body":"<p style=\"text-align:center;font-size:.85em;opacity:.8\">Conteúdo elaborado com <strong>ClassAuthor</strong>, uma ferramenta de planejamento pedagógico desenvolvida por Rogério Bittencourt, INOVALAB - IFSC.</p>","dropcap":false}}]}}]}

function waitForPrintableAssets() {
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  const images = Array.from(document.images).map(function (img) {
    if (img.complete) return Promise.resolve();
    return new Promise(function (resolve) {
      img.addEventListener("load", resolve, { once: true });
      img.addEventListener("error", resolve, { once: true });
    });
  });
  return Promise.all([fonts].concat(images)).then(function () {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { setTimeout(resolve, 500); });
      });
    });
  });
}

function openPrintVersion() {
