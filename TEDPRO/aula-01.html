// FLASHCARD — single flippable card (click to flip)
function FlashCard({ front, back, tone = "marigold" }) {
  const [flipped, setFlipped] = useState(false);
  const safeTone = AULA_TONES[tone] ? tone : "marigold";
  return (
    <button
      type="button"
      className="aula-flash"
      data-tone={safeTone}
      onClick={() => setFlipped((f) => !f)}
      aria-label={`Flashcard. ${flipped ? "Mostrando resposta" : "Mostrando pergunta"}. Clique para virar.`}
    >
      <div className={"aula-flash__inner" + (flipped ? " is-flipped" : "")}>
        <div className="aula-flash__face aula-flash__front">
          <span className="aula-flash__tag">Pergunta</span>
          <RichContent className="aula-flash__front-text" html={front}/>
          <span className="aula-flash__hint"><Icon name="rotate-ccw" size={13} color="var(--ink-mute)" /> clique para virar</span>
        </div>
        <div className="aula-flash__face aula-flash__back">
          <span className="aula-flash__tag aula-flash__tag--back">Resposta</span>
          <RichContent className="aula-flash__back-text" html={back}/>
        </div>
      </div>
    </button>
  );
}

// FLASHCARD DECK — multiple flashcards as a swipeable strip
function FlashCardDeck({ cards = [], tones = [], sectionTone = "paper", label = "Flashcards" }) {
  if (usePDF()) {
    // PDF: the deck only mounts one card on screen, so render every card
    // from data, front AND back side by side.
    return (
      <div className="aula-deck-print">
        <div className="aula-deck__label aula-kicker">
          <Icon name="layers" size={16} stroke={1.8} />
          <span>{label}</span>
        </div>
        <div className="aula-deck-print__grid">
          {cards.map((c, idx) => (
            <div key={idx} className="aula-flashcard-print">
              <div className="aula-flashcard-print__side aula-flashcard-print__side--front">
                <div className="aula-flashcard-print__tag">Pergunta {idx + 1}</div>
                <RichContent className="aula-flashcard-print__front" html={c.front}/>
              </div>
              <div className="aula-flashcard-print__side aula-flashcard-print__side--back">
                <div className="aula-flashcard-print__tag">Resposta</div>
                <RichContent className="aula-flashcard-print__back" html={c.back}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }
  const [i, setI] = useState(0);
  const max = cards.length;
  // No card may share the section's background colour — keep good contrast.
  const palette = (tones.length ? tones : ["marigold", "sage", "lavender", "coral", "ocean"]);
  const safeTones = palette.filter((t) => t !== sectionTone);
  const deckTones = safeTones.length ? safeTones : ["marigold", "sage", "lavender", "coral", "ocean"].filter((t) => t !== sectionTone);
  const toneFor = (idx) => {
    const explicit = cards[idx]?.tone;
    if (explicit && explicit !== sectionTone) return explicit;
    return deckTones[idx % deckTones.length] || "marigold";
  };
  return (
    <div className="aula-deck">
      <div className="aula-deck__head">
        <div className="aula-deck__label aula-kicker">
          <Icon name="layers" size={16} stroke={1.8} />
          <span>{label}</span>
        </div>
        <div className="aula-deck__counter">{i + 1} / {max}</div>
      </div>
      <div className="aula-deck__cardwrap">
        <FlashCard
          key={i}
          front={cards[i]?.front}
          back={cards[i]?.back}
          tone={toneFor(i)}
        />
      </div>
      <div className="aula-deck__controls">
        <button
          type="button"
          className="aula-deck__nav"
          onClick={() => setI((v) => Math.max(0, v - 1))}
          disabled={i === 0}
          aria-label="Anterior"
        >
          <Icon name="arrow-left" size={18} stroke={1.8} />
        </button>
        <div className="aula-deck__dots">
          {cards.map((_, idx) => (
            <button key={idx} type="button" onClick={() => setI(idx)} aria-label={`Ir para card ${idx + 1}`}
              className={"aula-deck__dot" + (idx === i ? " is-active" : "")}></button>
          ))}
        </div>
        <button
          type="button"
          className="aula-deck__nav"
          onClick={() => setI((v) => Math.min(max - 1, v + 1))}
          disabled={i === max - 1}
          aria-label="Próximo"
        >
          <Icon name="arrow-right" size={18} stroke={1.8} />
        </button>
      </div>
    </div>
  );
}

// SLIDER — horizontal carousel of full panels (step-by-step)
function SliderMarker({ step, index, print = false }) {
  const className = print ? "aula-step-print__num" : "aula-slider__num";
  if (step.icon) return <span className={className}><i className={fontAwesomeClass(step.icon)} aria-hidden="true"></i></span>;
  return <span className={className}>{step.marker || String(index + 1).padStart(2, "0")}</span>;
}

function RichContent({ html, className, tag = "div" }) {
  if (React.isValidElement(html)) return React.createElement(tag, { className }, html);
  return React.createElement(tag, { className, dangerouslySetInnerHTML: { __html: html || "" } });
}
function richPlain(value) {
  const source = React.isValidElement(value) ? value.props?.html : value;
  return String(source || "").replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim();
}
function RichInline({ value, className }) {
  if (React.isValidElement(value)) return <span className={className}>{value}</span>;
  return <span className={className} dangerouslySetInnerHTML={{ __html: value || "" }} />;
}

function Slider({ steps = [], label = "Passo a passo" }) {
  if (usePDF()) {
    // PDF: stack every step vertically so nothing stays behind the carousel.
    return (
      <div className="aula-card aula-slider-print">
        {label && <div className="aula-slider__label aula-kicker">
          <Icon name="play" size={14} stroke={0} color="var(--ink-mute)" style={{ fill: "var(--ink-mute)" }} />
          <span>{label}</span>
        </div>}
        <ol className="aula-slider-print__list">
          {steps.map((s, idx) => (
            <li key={idx} className="aula-step-print">
              <SliderMarker step={s} index={idx} print />
              <div>
                <RichInline className="aula-step-print__title" value={s.title} />
                <RichContent className="aula-step-print__body" html={s.body} />
              </div>
            </li>
          ))}
        </ol>
      </div>
    );
  }
  const [i, setI] = useState(0);
  const max = steps.length;
  return (
    <div className="aula-slider">
      <div className="aula-slider__head">
        {label && <div className="aula-slider__label aula-kicker">
          <Icon name="play" size={14} stroke={0} color="var(--ink-mute)" style={{ fill: "var(--ink-mute)" }} />
          <span>{label}</span>
        </div>}
        <div className="aula-slider__progress">
          {steps.map((_, idx) => (
            <span key={idx} className={"aula-slider__bar" + (idx <= i ? " is-on" : "")}></span>
          ))}
        </div>
        <div className="aula-slider__counter">{i + 1} / {max}</div>
      </div>
      <div className="aula-slider__frame">
        <div className="aula-slider__track" style={{ transform: `translateX(-${i * 100}%)` }}>
          {steps.map((s, idx) => (
            <div key={idx} className="aula-slider__slide">
              <SliderMarker step={s} index={idx} />
              <RichInline className="aula-slider__title" value={s.title} />
              <RichContent className="aula-slider__text" html={s.body} />
            </div>
          ))}
        </div>
      </div>
      <div className="aula-slider__controls">
        <button
          type="button"
          className="aula-slider__btn"
          onClick={() => setI((v) => Math.max(0, v - 1))} disabled={i === 0}
        >
          <Icon name="chevron-left" size={16} stroke={2} />
          <span>Anterior</span>
        </button>
        <button
          type="button"
          className="aula-slider__btn aula-slider__btn--primary"
          onClick={() => setI((v) => Math.min(max - 1, v + 1))} disabled={i === max - 1}
        >
          <span>{i === max - 1 ? "Concluído" : "Próximo"}</span>
          <Icon name="chevron-right" size={16} stroke={2} />
        </button>
      </div>
    </div>
  );
}

// ACCORDION — vertical stack of collapsibles
function Accordion({ items = [], renderBlocks }) {
  if (usePDF()) {
    // PDF: every item open, question + answer visible.
    return (
      <div className="aula-accordion-print">
        {items.map((it, idx) => {
          const title = it.title != null ? it.title : it.q;
          const body = it.body != null ? it.body : it.a;
          return (
          <div key={idx} className="aula-card aula-accordion-print__item">
            <div className="aula-accordion-print__row">
              <span className="aula-acc__num">{String(idx + 1).padStart(2, "0")}</span>
              <div>
                <RichContent className="aula-accordion-print__q" html={title} />
                <RichContent className="aula-accordion-print__a" html={body} />
                {renderBlocks && renderBlocks(it.children || [])}
              </div>
            </div>
          </div>
          );
        })}
      </div>
    );
  }
  const [open, setOpen] = useState(0);
  return (
    <div className="aula-accordion">
      {items.map((it, idx) => {
        const isOpen = open === idx;
        const title = it.title != null ? it.title : it.q;
        const body = it.body != null ? it.body : it.a;
        return (
          <div key={idx} className={"aula-acc__item" + (isOpen ? " is-open" : "")}>
            <button
              type="button"
              className="aula-acc__head"
              onClick={() => setOpen(isOpen ? -1 : idx)}
              aria-expanded={isOpen}
            >
              <span className="aula-acc__num">{String(idx + 1).padStart(2, "0")}</span>
              <RichContent className="aula-acc__q" html={title} tag="span" />
              <span className="aula-acc__chev">
                <Icon name="chevron-down" size={20} stroke={1.6} />
              </span>
            </button>
            <div className="aula-acc__bodywrap">
              <div className="aula-acc__clip">
                <RichContent className="aula-acc__body" html={body} />
                {renderBlocks && renderBlocks(it.children || [])}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// QUIZ — multiple questions, single-choice, submit + nova tentativa
function Quiz({ title = "Quiz", intro, questions = [], passMark = 0.6, avaliativo = false, pdfGabarito = true }) {
  if (usePDF()) {
    // PDF: questions stay clean; the compact answer key follows the activity.
    return (
      <section className="aula-card aula-quiz-print" aria-label="Quiz">
        <div className="aula-quiz__kicker aula-kicker">
          <Icon name="graduation-cap" size={16} stroke={1.8} color="var(--ink-mute)" />
          <RichInline value={title}/>
        </div>
        {intro && <RichContent className="aula-quiz__intro" html={intro} />}
        <ol className="aula-quiz-print__list">
          {questions.map((q, qi) => (
            <li key={qi} className="aula-quiz-q">
              <div className="aula-quiz__qhead">
                <span className="aula-quiz__qnum">{qi + 1}</span>
                <RichContent className="aula-quiz__qtext" html={q.q} />
              </div>
              <ul className="aula-quiz-print__options">
                {q.options.map((opt, oi) => {
                  return (
                    <li key={oi} className="aula-quiz-print__opt">
                      <span className="aula-quiz-print__letter">{String.fromCharCode(97 + oi) + ")"}</span>
                      <RichInline className="aula-quiz-print__opt-text" value={opt}/>
                    </li>
                  );
                })}
              </ul>
            </li>
          ))}
        </ol>
        {pdfGabarito && questions.length > 0 && (
          <aside className="aula-quiz-print__answer-key" aria-label="Gabarito e feedback">
            <h3>Gabarito e feedback</h3>
            <ol>
              {questions.map((q, qi) => (
                <li key={qi}>
                  <strong>{qi + 1}. {String.fromCharCode(65 + q.answer)}</strong>
                  {q.explanation && <RichContent className="aula-quiz-print__answer-text" html={q.explanation} />}
                </li>
              ))}
            </ol>
          </aside>
        )}
      </section>
    );
  }
  const [answers, setAnswers] = useState(() => questions.map(() => -1));
  const [submitted, setSubmitted] = useState(false);
  const [attempt, setAttempt] = useState(1);

  const total = questions.length;
  const correct = answers.reduce((n, a, i) => n + (a === questions[i].answer ? 1 : 0), 0);
  const ratio = total ? correct / total : 0;
  const threshold = Number(passMark) > 1 ? Number(passMark) / 10 : Number(passMark);
  const passed = ratio >= Math.max(0, Math.min(1, threshold || 0));
  const answeredAll = answers.every((a) => a >= 0);

  const choose = (qi, oi) => {
    if (submitted) return;
    setAnswers((prev) => prev.map((v, i) => (i === qi ? oi : v)));
  };
  const submit = () => {
    if (!answeredAll) return;
    setSubmitted(true);
    // Avaliativo: report the grade to the LMS on a 0–10 scale.
    if (avaliativo && window.AulaSCORM && typeof window.AulaSCORM.score === "function") {
      const nota10 = total ? Math.round((correct / total) * 10 * 10) / 10 : 0; // 0–10, 1 decimal
      try { window.AulaSCORM.score(nota10, passed); } catch (e) { /* noop */ }
    }
  };
  const retry = () => { setAnswers(questions.map(() => -1)); setSubmitted(false); setAttempt((a) => a + 1); };

  return (
    <section className="aula-quiz" aria-label="Quiz">
      <div className="aula-quiz__head">
        <span className="aula-quiz__kicker aula-kicker">
          <Icon name="graduation-cap" size={16} stroke={1.8} color="var(--ink-mute)" />
          <RichInline value={title}/>
        </span>
        <span className="aula-quiz__attempt">Tentativa {attempt}</span>
      </div>
      {intro && <RichContent className="aula-quiz__intro" html={intro} />}

      <ol className="aula-quiz__list">
        {questions.map((q, qi) => {
          const chosen = answers[qi];
          return (
            <li key={qi} className="aula-quiz__q">
              <div className="aula-quiz__qhead">
                <span className="aula-quiz__qnum">{qi + 1}</span>
                <RichContent className="aula-quiz__qtext" html={q.q} />
              </div>
              <div className="aula-quiz__options">
                {q.options.map((opt, oi) => {
                  const isChosen = chosen === oi;
                  const isAnswer = q.answer === oi;
                  let state = "idle";
                  if (submitted) {
                    if (isAnswer) state = "correct";
                    else if (isChosen) state = "wrong";
                  } else if (isChosen) state = "chosen";
                  return (
                    <button
                      key={oi}
                      type="button"
                      className="aula-quiz__opt"
                      data-state={state}
                      onClick={() => choose(qi, oi)}
                      disabled={submitted}
                      aria-pressed={isChosen}
                    >
                      <span className="aula-quiz__radio" data-state={state}>
                        {submitted && isAnswer && <Icon name="check" size={13} stroke={3} color="var(--paper)" />}
                        {submitted && isChosen && !isAnswer && <Icon name="x" size={13} stroke={3} color="var(--paper)" />}
                        {!submitted && isChosen && <span className="aula-quiz__radio-dot"></span>}
                      </span>
                      <RichInline className="aula-quiz__opt-text" value={opt}/>
                    </button>
                  );
                })}
              </div>
              {submitted && q.explanation && (
                <div className={"aula-quiz__explain" + (chosen === q.answer ? " is-ok" : " is-no")}>
                  <Icon name={chosen === q.answer ? "check-circle" : "alert-triangle"} size={15} stroke={1.9}
                        color={chosen === q.answer ? "var(--sage-deep)" : "var(--terracotta-deep)"} />
                  <RichContent html={q.explanation} />
                </div>
              )}
            </li>
          );
        })}
      </ol>

      <div className="aula-quiz__footer">
        {!submitted ? (
          <React.Fragment>
            <span className="aula-quiz__progress">
              {answers.filter((a) => a >= 0).length} de {total} respondidas
            </span>
            <button
              type="button"
              className="aula-quiz__submit"
              onClick={submit} disabled={!answeredAll}
            >
              Verificar respostas
              <Icon name="check" size={16} stroke={2.2} color="var(--paper)" />
            </button>
          </React.Fragment>
        ) : (
          <div className="aula-quiz__result">
            <div className={"aula-quiz__score" + (passed ? " is-pass" : " is-fail")}>
              <span className="aula-quiz__score-num">{correct}/{total}</span>
              <span className="aula-quiz__score-label">
                {avaliativo
                  ? `Nota ${(total ? Math.round((correct / total) * 100) / 10 : 0).toLocaleString("pt-BR")} \u2014 ${passed ? "aprovado" : "n\u00e3o atingiu a nota m\u00ednima"}`
                  : (passed ? "Voc\u00ea foi bem!" : "Vale revisar e tentar de novo")}
              </span>
            </div>
            <button type="button" className="aula-quiz__retry" onClick={retry}>
              <Icon name="refresh-cw" size={16} stroke={2} color="var(--ink)" />
              Nova tentativa
            </button>
          </div>
        )}
      </div>
    </section>
  );
}

// LINHA DO TEMPO — interativa, organizada em eras (períodos).
// Cada era tem rótulo + intervalo + cor (tone). Dentro dela,
// marcos por data; clicar abre texto e imagem opcional.
function LinhaDoTempo({ eras = [], title, renderBlocks }) {
  const pdf = usePDF();
  return (
    <div className="aula-timeline">
      {title && <RichInline className="aula-tl-toptitle" value={title}/>}
      {eras.map((era, ei) => {
        const tone = AULA_TONES[era.tone] || AULA_TONES.ocean;
        return (
          <section className="aula-tl-era" key={ei} style={{ "--tl-base": tone.base, "--tl-soft": tone.soft, "--tl-deep": tone.deep }}>
            <header className="aula-tl-era-head">
              <span className="aula-tl-era-dot" aria-hidden="true"></span>
              <RichInline className="aula-tl-era-label" value={era.label}/>
              {era.range && <RichInline className="aula-tl-era-range" value={era.range}/>}
            </header>
            <ol className="aula-tl-events">
              {(era.events || []).map((ev, vi) => (
                <TimelineEvent key={vi} ev={ev} defaultOpen={!!ev.open} print={pdf} renderBlocks={renderBlocks} />
              ))}
            </ol>
          </section>
        );
      })}
    </div>
  );
}

function TimelineEvent({ ev, defaultOpen = false, print = false, renderBlocks }) {
  const [open, setOpen] = useState(!!defaultOpen);
  const hasImg = !!(ev.src || ev.slotId);
  const hasDetail = !!(ev.text || hasImg || (ev.children || []).length);
  const detailContent = hasDetail && (
    <React.Fragment>
      {hasImg && (
        <div className="aula-tl-img">
          {ev.src
            ? <img src={ev.src} alt={richPlain(ev.title)} />
            : <image-slot id={ev.slotId || "tl-img"} shape="rect" placeholder={richPlain(ev.title) || "Imagem do marco"} style={{ width: "100%", height: "100%" }}></image-slot>}
        </div>
      )}
      {ev.text && <RichContent className="aula-tl-text" html={ev.text}/>}
      {renderBlocks && renderBlocks(ev.children || [])}
    </React.Fragment>
  );
  if (print) {
    return (
      <li className="aula-tl-event aula-tl-event--print is-open">
        <div className="aula-tl-marker aula-tl-marker--print">
          <span className="aula-tl-dot" aria-hidden="true"></span>
          <span className="aula-tl-mk-main">
            <RichInline className="aula-tl-date" value={ev.date}/>
            <RichInline className="aula-tl-title" value={ev.title}/>
          </span>
        </div>
        {hasDetail && <div className="aula-tl-detail">{detailContent}</div>}
      </li>
    );
  }
  return (
    <li className={"aula-tl-event" + (open ? " is-open" : "")}>
      <button type="button" className="aula-tl-marker" onClick={() => hasDetail && setOpen((o) => !o)} aria-expanded={open} disabled={!hasDetail}>
        <span className="aula-tl-dot" aria-hidden="true"></span>
        <span className="aula-tl-mk-main">
          <RichInline className="aula-tl-date" value={ev.date}/>
          <RichInline className="aula-tl-title" value={ev.title}/>
        </span>
        {hasDetail && (
          <span className="aula-tl-chev" aria-hidden="true">
            <Icon name="chevron-down" size={18} stroke={1.7} color="var(--ink-mute)" />
          </span>
        )}
      </button>
      {hasDetail && (
        <div className="aula-tl-detailwrap">
          <div className="aula-tl-clip">
            <div className="aula-tl-detail">
              {detailContent}
            </div>
          </div>
        </div>
      )}
    </li>
  );
}

// ════════════════════════════════════════════════════════════
// DADOS & CONTEÚDO — tabela, cases, features, materiais,
// referências, texto+imagem

// TABELA — striped, otimizada para mobile.
//   No desktop: tabela normal com zebra striping discreto.
//   No mobile (<600px): cada linha vira um cartão e cada célula
//   exibe o rótulo da sua coluna (via data-label). Sem scroll-x.
function Tabela({ caption, fonte, headers = [], rows = [], striped = true, destacarPrimeira = true, compact = false }) {
  const cls = [
    "aula-tabela",
    striped ? "aula-tabela--striped" : "",
    compact ? "aula-tabela--compact" : "",
    destacarPrimeira ? "aula-tabela--rowhead" : "",
  ].filter(Boolean).join(" ");
  return (
    <figure className="aula-tabela-wrap">
      <table className={cls} style={{ "--table-columns": Math.max(headers.length, 1) }}>
        {caption && <caption className="aula-tabela-caption"><RichInline value={caption}/></caption>}
        <thead>
          <tr>
            {headers.map((h, i) => <th key={i} scope="col"><RichInline value={h}/></th>)}
          </tr>
        </thead>
        <tbody>
          {rows.map((r, ri) => (
            <tr key={ri}>
              {r.map((cell, ci) =>
                ci === 0 && destacarPrimeira ? (
                  <th key={ci} scope="row" data-label={richPlain(headers[ci])}><RichInline value={cell}/></th>
                ) : (
                  <td key={ci} data-label={richPlain(headers[ci])}><RichInline value={cell}/></td>
                )
              )}
            </tr>
          ))}
        </tbody>
      </table>
      {fonte && <figcaption className="aula-tabela-fonte"><RichInline value={fonte}/></figcaption>}
    </figure>
  );
}

// CASE CARDS — cover image + title + short text
function CaseCards({ title, intro, cards = [], columns = 2, layout = "vertical" }) {
  const horizontal = layout === "horizontal";
  const cols = String(columns) === "3" ? "3" : "2";
  const mediaType = (card) => card.mediaType || card.media || "image";
  return (
    <section className="aula-cases">
      {title && <RichInline className="aula-cases__title" value={title} />}
      {intro && <RichContent className="aula-cases__intro" html={intro} />}
      <div className={"aula-cases-grid" + (horizontal ? " is-horizontal" : "")} data-cols={cols}>
        {cards.map((c, i) => {
          const kind = mediaType(c);
          return (
            <div key={i} className={"aula-case-card" + (kind === "none" ? " is-text-only" : "")}>
              {kind !== "none" && (
                <div className={"aula-case-cover" + (kind === "icon" ? " is-icon" : "")}>
                  {kind === "icon" ? (
                    <i className={`fa-solid fa-${c.icon || "lightbulb"}`} aria-hidden="true"></i>
                  ) : c.src ? (
                    <img src={c.src} alt="" className="aula-case-cover-img" />
                  ) : (
                    <image-slot id={c.slotId || `case-${i}`} shape="rect" placeholder={richPlain(c.tag) || "Imagem"} style={{ width: "100%", height: "100%" }}></image-slot>
                  )}
                  {c.tag && <RichInline className="aula-case-tag" value={c.tag} />}
                </div>
              )}
              <div className="aula-case-body">
                {kind === "none" && c.tag && <RichInline className="aula-case-tag aula-case-tag--inline" value={c.tag} />}
                <RichInline className="aula-case-title" value={c.title} />
                <RichContent className="aula-case-text" html={c.text} />
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

// FEATURE GRID — célula de "feature": badge redondo colorido com
// ícone (Font Awesome) + título curto + linha de texto, em grade
// responsiva (1 / 2 / 3 por linha).
function FeatureGrid({ title, intro, features = [], align = "center", columns = 3 }) {
  const centered = align === "center";
  return (
    <section className={"aula-features" + (centered ? " aula-features--center" : " aula-features--left")}>
      {title && <RichInline className="aula-features__title" value={title} />}
      {intro && <RichContent className="aula-features__intro" html={intro} />}
      <div className="aula-feature-grid" style={{ "--feature-columns": Math.max(1, Math.min(4, Number(columns) || 3)) }}>
        {features.map((f, i) => {
          const safeTone = AULA_TONES[f.tone] ? f.tone : "ocean";
          return (
            <div key={i} className="aula-feature-item" data-tone={safeTone}>
              <span className="aula-feature__badge" aria-hidden="true">
                <i className={fontAwesomeClass(f.icon)}></i>
              </span>
              <RichInline className="aula-feature__title" value={f.title} />
              {f.text && <RichContent className="aula-feature__text" html={f.text} />}
            </div>
          );
        })}
      </div>
    </section>
  );
}

// COLUNAS — conteúdo editorial paralelo; empilha no mobile e preserva HTML rico.
function Columns({ columns = [], gap = "normal", emphasis = "none", renderBlocks }) {
  const wideIndex = emphasis === "none" ? -1 : Number(emphasis);
  const layout = columns.map((_, index) => index === wideIndex ? "2fr" : "1fr").join(" ");
  return <div className="aula-columns" data-gap={gap} data-emphasis={emphasis} style={{ "--column-count": Math.max(1, Math.min(4, columns.length || 1)), "--column-layout": layout || "1fr" }}>
    {columns.map((column, index) => <section className="aula-column" key={index}>
      {column.title && <RichInline className="aula-column__title" value={column.title} />}
      {column.body && <RichContent className="aula-column__body" html={column.body} />}
      {renderBlocks && <div className="aula-column__blocks">{renderBlocks(column.children || [], index)}</div>}
    </section>)}
  </div>;
}

function CollapsibleSection({ title = "Saiba mais", summary, children, open = false }) {
  if (usePDF()) return <section className="aula-collapsible is-print"><h3>{title}</h3>{summary && <p className="aula-collapsible__summary">{summary}</p>}<div className="aula-collapsible__body">{children}</div></section>;
  return <details className="aula-collapsible" open={open}>
    <summary><span><strong>{title}</strong>{summary && <small>{summary}</small>}</span><Icon name="chevron-down" size={20} stroke={1.7} /></summary>
    <div className="aula-collapsible__body">{children}</div>
  </details>;
}

function SectionSlider({ label = "Explore", slides = [] }) {
  const [i, setI] = useState(0);
  const max = slides.length;
  if (usePDF()) return <div className="aula-section-slider is-print">{slides.map((s, idx) => <section key={idx}><span className="aula-kicker">{s.eyebrow}</span><h3>{s.title}</h3><RichContent html={s.body} /></section>)}</div>;
  const slide = slides[i] || {};
  return <section className="aula-section-slider">
    <div className="aula-section-slider__head"><span className="aula-kicker">{label}</span><span>{max ? i + 1 : 0} / {max}</span></div>
    <div className="aula-section-slider__panel"><span className="aula-kicker">{slide.eyebrow}</span><h3>{slide.title}</h3><RichContent html={slide.body} /></div>
    <div className="aula-section-slider__controls"><button disabled={i === 0} onClick={() => setI((v) => Math.max(0, v - 1))}><Icon name="arrow-left" size={17} /> Anterior</button><div>{slides.map((_, idx) => <button className={idx === i ? "is-active" : ""} key={idx} aria-label={`Ir para seção ${idx + 1}`} onClick={() => setI(idx)} />)}</div><button disabled={i >= max - 1} onClick={() => setI((v) => Math.min(max - 1, v + 1))}>Próxima <Icon name="arrow-right" size={17} /></button></div>
  </section>;
}

// MATERIAIS EXTRAS — leituras / links com tipo e fonte
function MateriaisExtras({ title = "Para ir além", items = [] }) {
  const iconFor = { pdf: "file-text", artigo: "newspaper", livro: "book-marked", video: "play-circle", site: "link", download: "download" };
  return (
    <section className="aula-materiais" aria-label={title}>
      <div className="aula-materiais__head">
        <Icon name="book-open" size={18} stroke={1.7} color="var(--marigold-deep)" />
        <RichInline className="aula-materiais__title" value={title} />
      </div>
      <ul className="aula-materiais__list">
        {items.map((it, i) => (
          <li key={i}>
            <a href={it.href || "#"} target="_blank" rel="noopener" className="aula-materiais__item">
              <span className="aula-materiais__icon">
                <Icon name={iconFor[it.type] || "link"} size={18} stroke={1.7} color="var(--ink-soft)" />
              </span>
              <span className="aula-materiais__body">
                <RichInline className="aula-materiais__item-title" value={it.title} />

            </a>
          </li>
        ))}
      </ul>
    </section>
  );
}

// REFERÊNCIAS ABNT — collapsed list, hanging indent, NBR 6023
function ReferenciasABNT({ title = "Referências", items = [], defaultOpen = false, dark = false }) {
  if (usePDF()) {
    // PDF: always open, full list, optionally starting on a fresh page.
    return (
      <section className={"aula-pagebreak-before aula-refs-print" + (dark ? " aula-refs--dark" : "")}>
        <h2 className="aula-refs-print__title">{title}</h2>
        <ol className="aula-refs__list aula-refs-print__list">
          {items.map((r, i) => (
            <li key={i} className="aula-refs__ref" dangerouslySetInnerHTML={{ __html: r }}></li>
          ))}
        </ol>
      </section>
    );
  }
  const [open, setOpen] = useState(defaultOpen);
  return (
    <section className={"aula-refs" + (dark ? " aula-refs--dark" : "") + (open ? " is-open" : "")} data-toc-item="" data-toc-text={title}>

        <span className="aula-refs__head-left">
          <Icon name="book-marked" size={18} stroke={1.7} color="currentColor" />
          <span className="aula-refs__title">{title}</span>

      <div className="aula-refs__bodywrap">
        <div className="aula-refs__clip">
          <ol className="aula-refs__list">
            {items.map((r, i) => (
              <li key={i} className="aula-refs__ref" dangerouslySetInnerHTML={{ __html: r }}></li>
            ))}
          </ol>

// TEXTO + IMAGEM — bloco de duas colunas com sangria.
//   A imagem flutua para um lado e PODE ultrapassar a coluna
//   container (sangria configurável). O texto contorna a imagem e,
//   quando é mais alto, segue por baixo ocupando a largura total.
//   ordem="texto-imagem" | "imagem-texto" · largura ex. "46%" · sangria ex. "8%"
function TextoImagem({ children, texto, src, slotId, legenda, fonte, ordem = "texto-imagem", largura = "46%", sangria = "8%" }) {
  const imgLeft = ordem === "imagem-texto";
  const pdf = usePDF();
  const cls = [
    "aula-texto-imagem",
    imgLeft ? "aula-ti--img-left" : "aula-ti--img-right",
    pdf ? "aula-ti--pdf" : "",
  ].filter(Boolean).join(" ");
  const style = { "--ti-w": largura, "--ti-bleed": "-" + sangria };

  const figura = (
    <figure className="aula-ti-fig">
      {src
        ? <img className="aula-ti-img" src={src} alt={richPlain(legenda)} />
        : <div className="aula-ti-slot"><image-slot id={slotId || "ti-img"} shape="rect" placeholder={richPlain(legenda) || "Imagem"} style={{ width: "100%", height: "100%" }}></image-slot></div>}
      {(legenda || fonte) && (
        <figcaption className="aula-ti-cap">
          <RichInline value={legenda}/>
          {fonte && <span className="aula-ti-fonte"> — <RichInline value={fonte}/></span>}
        </figcaption>
      )}
    </figure>
  );

  return (
    <div className={cls} style={style}>
      {figura}
      <div className="aula-ti-texto">
        {texto ? <p>{texto}</p> : children}
      </div>
    </div>
  );
}

// LESSON COMPLETE — single SCORM-completion CTA.
// Calls window.AulaSCORM.complete() which sets completion +
// success status. No prev/next nav — the host LMS owns navigation.
function LessonComplete({ onComplete }) {
  if (usePDF()) return null; // the SCORM “mark complete” CTA has no meaning on paper
  const [done, setDone] = useState(false);
  const handle = () => {
    let ok = false;
    try {
      if (window.AulaSCORM && typeof window.AulaSCORM.complete === "function") {
        ok = window.AulaSCORM.complete();
      }
    } catch (e) { /* noop */ }
    setDone(true);
    if (onComplete) onComplete(ok);
  };
  return (
    <section className="aula-complete">
      <div className="aula-complete__inner">
        <div className={"aula-complete__ring" + (done ? " is-done" : "")}>
          <Icon name={done ? "check" : "award"} size={26} stroke={2} color={done ? "var(--paper)" : "var(--sage-deep)"} />
        </div>
        <h2 className="aula-complete__title">
          {done ? "Aula concluída — bom trabalho!" : "Você chegou ao fim desta aula"}
        </h2>
        <p className="aula-complete__sub">
          {done
            ? "Seu progresso foi registrado na plataforma."
            : "Ao marcar como concluída, sua conclusão deste conteúdo é registrada na plataforma."}
        </p>
        <button
          type="button"
          className={"aula-complete__btn" + (done ? " is-done" : "")}
          onClick={done ? undefined : handle}
          disabled={done}
        >
          {done ? "Aula concluída" : "Marcar aula como concluída"}
          <Icon name="check" size={18} stroke={2} color="var(--paper)" />
        </button>
      </div>
    </section>
  );
}

// CREDITS FOOTER — authorship, AI support, CC BY-NC-SA license.
// Sits at the very bottom of every Aula unit.
function CreditsFooter({ author, role, institution, year, aiTool, aiUse, licenseHref }) {
  const hasCredits = author || aiTool || licenseHref;
  return (
    <footer className="aula-credits">
      {hasCredits && (
        <div className="aula-credits__inner">
          {author && (
            <div className="aula-credits__block">
              <div className="aula-credits__label">Autoria</div>
              <p className="aula-credits__author">{author}</p>
              {(role || institution || year) && (
                <p className="aula-credits__meta">{role}{institution ? ` · ${institution}` : ""}{year ? ` · ${year}` : ""}</p>
              )}
            </div>
          )}

          {aiTool && (
            <div className="aula-credits__block">
              <div className="aula-credits__label">Apoio de IA</div>
              <p className="aula-credits__meta">
                Produzido com apoio de <strong className="aula-credits__strong">{aiTool}</strong>{(() => { const u = (aiUse || "").trim(); return u ? (/^[,;:.]/.test(u) ? "" : " ") + (/[.!?]$/.test(u) ? u : u + ".") : "."; })()} A curadoria, revisão e responsabilidade pelo conteúdo são humanas.
              </p>
            </div>
          )}

          <div className="aula-credits__block">
            <div className="aula-credits__label">Licença</div>
            <a href={licenseHref || "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br"} target="_blank" rel="noopener" className="aula-credits__license">
              <span className="aula-credits__cc-group" aria-hidden="true">
                <CCGlyph kind="cc" /><CCGlyph kind="by" /><CCGlyph kind="nc" /><CCGlyph kind="sa" />
              </span>
              <span className="aula-credits__cc-text">CC BY-NC-SA 4.0</span>
            </a>
            <p className="aula-credits__meta">
              Você pode compartilhar e adaptar, citando a autoria, sem uso comercial e
              mantendo a mesma licença.
            </p>
          </div>
        </div>
      )}

      <AulaStudioMark withRule={hasCredits} />
    </footer>
  );
}

// AULA AUTHOR MARK — mandatory attribution. Always rendered at the
// very bottom of every Aula unit; cannot be removed by the author.
function AulaStudioMark({ withRule = true }) {
  return (
    <p className={"aula-credits__mark" + (withRule ? " aula-credits__mark--rule" : "")}>
      Aula editada com <strong className="aula-credits__mark-name">Class<i style={{ fontFamily: "Newsreader, Georgia, serif", fontWeight: 400 }}>Atelier</i></strong>, uma ferramenta de autoria de aulas interativas e pacotes SCORM, baseada integralmente no <a href="https://luislindner.github.io/lumeauthor/" target="_blank" rel="noopener noreferrer" style={{ color: "inherit", textDecoration: "underline", textUnderlineOffset: 2 }}>LumeAuthor</a>, ferramenta de autoria SCORM criada por Luís Lindner, e evoluída em coautoria com Rogério Bittencourt (INOVALAB - IFSC).
    </p>
  );
}
function CCGlyph({ kind }) {
  // Compact circular CC marks rendered as text labels for fidelity without external assets.
  const labels = { cc: "CC", by: "BY", nc: "NC", sa: "SA" };
  return (
    <span className="aula-credits__cc-chip">{labels[kind]}</span>
  );
}

ivos de aprendizagem","body":"<p>Ao final desta semana, você será capaz de:</p><ul><li>Definir SIGE (Sistema de Informação para Gestão Educacional) e situar o SIGAA e o SUAP como exemplos concretos</li><li>Descrever a arquitetura modular desses sistemas e como ela reflete a estrutura organizacional de uma instituição multicampi</li><li>Comparar SIGAA e SUAP a partir de um caso real de decisão institucional</li><li>Analisar os riscos de dependência técnica quando um sistema é mantido por outra instituição, à luz da literatura de Fatores Críticos de Sucesso em ERP</li><li>Compreender o conceito de Software Público Brasileiro e sua relação com a Rede Federal de Educação</li><li>Compreender o papel do Educacenso e da integração entre sistemas na produção de estatísticas oficiais</li><li>Problematizar a tensão entre personalização e padronização em sistemas de gestão de larga escala.</li></ul>","tone":"sage","icon":""}},{"id":"c-title-3-003","type":"titulo","props":{"text":"1. SIGE: sistemas com propósito de gestão, não só de registro","level":"h2"}},{"id":"chmy410q","type":"pitaco","props":{"kicker":"Pitaco do Prof. Rogério","name":"Rogério Bittencourt","role":"","tone":"ocean","src":"assets/images/aula-01-image-001.jpg","slotId":"","body":"<p><i>Relembrando a Semana 1: um Sistema de Informação é o conjunto de <b>pessoas, processos, dados e tecnologia</b> organizado com um propósito de gestão. Um SIGE é a aplicação desse conceito ao contexto educacional — um sistema (ou conjunto de sistemas) que sustenta o fluxo de vida acadêmica de um estudante, do primeiro dia de aula à emissão do diploma, além dos processos administrativos que viabilizam esse fluxo.</i></p>"}},{"id":"c-prose-3-005","type":"prose","props":{"body":"<p>Na literatura internacional de sistemas de informação corporativos, esse tipo de sistema integrado é geralmente chamado de <strong>ERP</strong> (<em>Enterprise Resource Planning</em> — Planejamento de Recursos Empresariais): um software único, modular, que centraliza processos antes espalhados em sistemas isolados. A ideia central de um ERP — e isso vale tanto para uma indústria automobilística quanto para um Instituto Federal — é que módulos antes independentes (financeiro, recursos humanos, estoque, no caso de uma empresa; matrícula, frequência, biblioteca, no caso de uma instituição de ensino) compartilhem a <strong>mesma base de dados</strong>, eliminando a necessidade de digitar a mesma informação duas vezes em sistemas diferentes — o mesmo espírito do princípio \"Once-Only\" que vimos na Semana 2, agora aplicado dentro dos limites de uma única instituição, e não do Estado como um todo.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-imagem-3-007","type":"imagem","bg":"neutral-default","pad":"normal","props":{"src":"assets/images/aula-01-image-002.png","slotId":"","caption":"Figura 1: Antes x Depois de um ERP","credit":"","ratio":"1400/600","alt":"Antes x Depois de um ERP"}},{"id":"c-prose-3-006","type":"prose","props":{"body":"<p>SIGAA e SUAP são, na prática, dois ERPs de setor público, adaptados à realidade educacional brasileira — e boa parte da literatura acadêmica e das boas práticas sobre implementação de ERP em empresas privadas (sobre as quais existem décadas de pesquisa em Sistemas de Informação) se aplica, com adaptações, à nossa realidade. Isso inclui, por exemplo, a compreensão de que a maior parte do \"trabalho\" de implementar um ERP não é técnico, mas organizacional: mapear processos, treinar pessoas e gerir resistências — retomando, mais uma vez, o conceito de gestão da mudança que já apareceu na Semana 1, ao discutirmos a Teoria da Difusão de Inovações de Rogers.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-title-3-008","type":"titulo","props":{"text":"2. O SIGAA: a realidade acadêmica do IFSC","level":"h2"}},{"id":"c-prose-3-009","type":"prose","props":{"body":"<p>O <strong>SIGAA (Sistema Integrado de Gestão de Atividades Acadêmicas)</strong> foi desenvolvido pela Universidade Federal do Rio Grande do Norte (UFRN) e hoje é usado por dezenas de universidades e institutos federais brasileiros, incluindo o IFSC — entre eles a UFPI, UFS, UFRRJ e a própria UnB, cada uma operando sua própria instância do sistema, mas todas compartilhando a mesma base de código mantida centralmente pela UFRN. É organizado em módulos por área (Graduação, Pós-Graduação Stricto Sensu, Pesquisa, Extensão, entre outros), com portais diferenciados por perfil de usuário — Portal Discente, Portal Docente, Portal da Coordenação — cada um expondo apenas as funcionalidades relevantes àquele papel.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-imagem-3-010","type":"imagem","bg":"neutral-default","pad":"normal","props":{"src":"assets/images/aula-01-image-003.jpg","slotId":"","caption":"Figura 2: Sistema Integrado de Gestão de Atividades Acadêmicas - SIGAA-IFSC","credit":"","ratio":"1600/1083","alt":"Sistema Integrado de Gestão de Atividades Acadêmicas - SIGAA-IFSC"}},{"id":"c-prose-3-011","type":"prose","props":{"body":"<p>No dia a dia, o SIGAA é a ferramenta usada para rematrícula, trancamento e cancelamento de componentes curriculares, consulta de notas, emissão de históricos e atestados. Por trás dessa interface simples, existe uma estrutura de dados bastante complexa: matriz curricular, estrutura curricular, equivalências entre disciplinas, integralização de créditos — todo o \"esqueleto\" que precisa estar corretamente modelado para que a vida acadêmica de um estudante faça sentido burocrática e pedagogicamente.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-012","type":"prose","props":{"body":"<p>Um detalhe interessante do modelo de manutenção do SIGAA: como cada instituição roda sua própria instância (por exemplo, sigaa.ufpi.br, sigaa.unb.br), pequenas particularidades de cada universidade aparecem no rodapé do próprio sistema — mas a base tecnológica e o \"código-fonte-mãe\" seguem sendo mantidos pela equipe da UFRN, que atualiza a plataforma continuamente desde 2009 (2006 nas primeiras versões).</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-vejamais-3-013","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>O guia de gestão acadêmica da UFC (outra instituição que usa o SIGAA) é uma boa leitura complementar para entender a lógica de módulos e perfis de acesso do sistema — a estrutura é essencialmente a mesma em qualquer instituição que o adote, incluindo o IFSC.</p><ul><li><a href=\"https://guiaprograd.ufc.br/knowledge-base/sistema-integrado-de-gestao-de-atividades-academicas-sigaa\" target=\"_blank\" rel=\"noopener\">SIGAA — Guia de Gestão Acadêmica da Graduação, UFC</a></li></ul>","tone":"sage","icon":""}},{"id":"c7i8seo6","type":"pitaco","props":{"kicker":"Pitaco do Prof. Rogério","name":"Rogério Bittencourt","role":"","tone":"sage","src":"assets/images/aula-01-image-001.jpg","slotId":"","body":"<p><i>Um detalhe que costuma passar despercebido: como cada instituição opera sua própria instância do SIGAA (por exemplo, o IFSC roda a sua, separada da instância da UFPI ou da UnB), pequenas divergências de configuração e de fluxo de trabalho aparecem entre instituições diferentes, mesmo usando \"o mesmo sistema\". Isso é outro exemplo prático da tensão entre personalização e padronização que vamos formalizar mais à frente, nesta mesma semana.</i></p>"}},{"id":"c-title-3-015","type":"titulo","props":{"text":"3. O SUAP: crescimento acelerado e um \"primo\" nascido também no Rio Grande do Norte","level":"h2"}},{"id":"c-prose-3-016","type":"prose","props":{"body":"<p>Aqui vai uma curiosidade histórica pouco conhecida, mas didaticamente valiosa: tanto o SIGAA quanto o <strong>SUAP (Sistema Unificado de Administração Pública)</strong> nasceram no Rio Grande do Norte — o primeiro na UFRN, o segundo no IFRN, criado em 2006 pela Coordenação de Sistemas de Informação (Cosinf) da Diretoria de Gestão de Tecnologia da Informação (DIGTI) — mas com escopos diferentes. Enquanto o SIGAA nasceu focado em gestão <em>acadêmica</em> universitária, o SUAP nasceu focado em gestão <em>administrativa</em> de um Instituto Federal (recursos humanos, almoxarifado, patrimônio, protocolo), expandindo depois para módulos acadêmicos, de pesquisa e de extensão próprios.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-017","type":"prose","props":{"body":"<p>Tecnicamente, o SUAP é construído em <strong>Python, Django, PostgreSQL, NGINX, Gunicorn e JQuery</strong>, e é um projeto de código aberto, cedido pelo IFRN a outras instituições por meio de convênios técnicos — sem custo de licenciamento.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-3-018","type":"titulo","props":{"text":"3.1 De 29 para 75 instituições: um crescimento que vale a pena observar","level":"h3"}},{"id":"c-prose-3-019","type":"prose","props":{"body":"<p>O crescimento recente do SUAP é notável. Se há poucos anos o sistema era usado por cerca de 29 Institutos Federais, hoje o <strong>Portal do SUAP</strong> já lista <strong>75 instituições conveniadas</strong> em todo o Brasil — incluindo, desde maio de 2025, o Instituto Federal Catarinense (IFC, instituição irmã do IFSC aqui no estado, não confundir os dois), e, um marco importante, a primeira universidade federal a aderir ao sistema: a <strong>Universidade Federal do Paraná (UFPR)</strong>, desde junho de 2025. O SUAP também expandiu para além da educação: prefeituras como Ariquemes (RO), Campos dos Goytacazes (RJ) e diversos municípios do Rio Grande do Norte já utilizam o sistema para modernizar sua própria gestão pública municipal — uma trajetória que começou dentro de um Instituto Federal e hoje serve a toda a administração pública brasileira.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-imagem-3-020","type":"imagem","bg":"neutral-default","pad":"normal","props":{"src":"assets/images/aula-01-image-004.png","slotId":"","caption":"Figura 4: Crescimento de Instituições Conveniadas ao SUAP","credit":"","ratio":"1400/560","alt":"Crescimento de Instituições Conveniadas ao SUAP"}},{"id":"c-prose-3-021","type":"prose","props":{"body":"<p>Dois detalhes técnicos mostram a maturidade do projeto: o módulo de Central de Serviços de TI do SUAP é construído com base nas boas práticas do <strong>ITIL</strong> (<em>Information Technology Infrastructure Library</em>), framework internacional de gestão de serviços de TI amplamente usado no setor corporativo — mostrando que um software público brasileiro pode, sim, incorporar padrões internacionais de qualidade. E, conectando diretamente com a discussão de acessibilidade que teremos na Semana 5, o SUAP já disponibiliza um <strong>\"Modo Daltonismo\"</strong>, tema visual pensado especificamente para usuários com daltonismo — um exemplo concreto de acessibilidade digital aplicada a um sistema de gestão pública real, e não apenas um princípio abstrato de design.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-vejamais-3-022","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>O Portal do SUAP lista todas as 75 instituições conveniadas, os 10 módulos do sistema e as atualizações mais recentes (incluindo o Modo Daltonismo) — um bom exercício para perceber a escala real de reuso de um software público desenvolvido dentro do próprio serviço público.</p><ul><li><a href=\"https://portal.suap.ifrn.edu.br/\" target=\"_blank\" rel=\"noopener\">Portal do SUAP — módulos e instituições conveniadas</a></li></ul>","tone":"coral","icon":"graduation-cap"}},{"id":"c-subtitle-3-023","type":"titulo","props":{"text":"3.2 Um caso real de decisão institucional: o que o Ifal encontrou ao trocar de sistema","level":"h3"}},{"id":"c-prose-3-024","type":"prose","props":{"body":"<p>Um exemplo concreto e muito instrutivo é o do <strong>Instituto Federal de Alagoas (IFAL)</strong>, que decidiu migrar do antigo sistema SIG (que incluía o Sipac e o SIGRH) para o SUAP. Segundo o diretor de TI do Ifal à época, a migração significaria uma <strong>economia de mais de R$ 800 mil</strong> antes gastos com manutenção e suporte externo do sistema anterior — já que, no modelo SUAP, os custos se resumem a bolsas para servidores do IFRN e do próprio Ifal durante o período de implantação (cerca de 18 meses).</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-025","type":"prose","props":{"body":"<p>Mais interessante ainda é a justificativa técnica dada pelo diretor para preferir o SUAP a uma alternativa \"concorrente\" natural, o próprio SIGAA: segundo ele, o SUAP traz funcionalidades de pesquisa e extensão que o SIGAA não tinha, precisamente porque <strong>\"o Suap foi desenvolvido com as características do Instituto Federal e o SIG foi criado numa universidade\"</strong> — uma frase curta que resume uma lição importante desta semana: <strong>não existe sistema neutro</strong>; cada ERP carrega, na sua própria arquitetura de módulos, os pressupostos institucionais de quem o desenhou originalmente. Um sistema pensado para universidades tende a modelar bem pesquisa e pós-graduação; um sistema pensado para Institutos Federais tende a modelar melhor a articulação entre ensino técnico, médio e superior, e a relação com o mundo do trabalho.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-vejamais-3-026","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>A notícia completa sobre a implantação do SUAP no Ifal detalha o cronograma de 18 meses de migração e a comparação direta entre os dois sistemas — uma leitura ótima para quem um dia participar de uma decisão institucional semelhante.</p><ul><li><a href=\"https://www2.ifal.edu.br/noticias/ifal-inicia-implantacao-do-suap-ferramenta-que-ira-reunir-sistemas-em-uma-so-plataforma\" target=\"_blank\" rel=\"noopener\">Ifal inicia implantação do Suap — Instituto Federal de Alagoas</a></li></ul>","tone":"sage","icon":""}},{"id":"c-title-3-027","type":"titulo","props":{"text":"4. Uma tensão pouco discutida: quem mantém o seu sistema?","level":"h2"}},{"id":"c-prose-3-028","type":"prose","props":{"body":"<p>Aqui está um ponto que raramente aparece nos manuais de usuário, mas que todo gestor de tecnologia educacional deveria levar a sério: <strong>tanto o SIGAA quanto o SUAP são mantidos centralmente por outra instituição</strong> (UFRN e IFRN, respectivamente). Isso traz vantagens claras — custo de desenvolvimento compartilhado, comunidade de usuários grande, atualizações constantes, como vimos no caso do Ifal — mas também uma dependência técnica real.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-imagem-3-029","type":"imagem","bg":"neutral-default","pad":"normal","props":{"src":"assets/images/aula-01-image-005.png","slotId":"","caption":"Figura 5: Cadeia de Dependência Técnica IFRN","credit":"","ratio":"1400/520","alt":"Cadeia de Dependência Técnica IFRN"}},{"id":"c-prose-3-030","type":"prose","props":{"body":"<p>A literatura internacional sobre implementação de sistemas ERP identifica, há décadas, um conjunto de <strong>Fatores Críticos de Sucesso (Critical Success Factors)</strong> que determinam se a adoção de um sistema desse porte vai bem ou mal: apoio da alta gestão, gestão de mudança organizacional, treinamento adequado dos usuários, e — especialmente relevante aqui — a decisão consciente entre <strong>customização</strong> (adaptar o sistema à instituição) e <strong>adaptação de processos</strong> (adaptar a instituição ao sistema). Um exemplo concreto: quando o Instituto Federal de Goiás (IFG) precisou atualizar sua versão do SUAP para uma release mais recente do IFRN, o processo de reintegrar todo o código customizado pelo IFG à nova versão levou cerca de oito meses de trabalho técnico — um caso real de como customização em excesso pode se transformar, ela mesma, em uma forma de dívida técnica (lembra do conceito que vamos formalizar na Semana 6, sobre vibe coding?).</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c937gl35","type":"destaque","props":{"title":"Veja bem","body":"<p>Esse é um ponto de atenção genuíno para qualquer Plano Diretor de Tecnologia da Informação (PDTI) institucional: depender de um sistema mantido externamente reduz custos, mas também reduz autonomia. Não existe almoço grátis em arquitetura de sistemas — só existe a escolha consciente de qual tipo de custo você está disposto a pagar (financeiro, técnico, ou de autonomia).</p>","tone":"terracotta","icon":""}},{"id":"c-reflection-3-032","type":"reflexao","props":{"title":"Para refletir (não vale nota)","question":"No seu campus, quando algo trava no SIGAA e a solução depende de uma equipe fora da instituição, quanto tempo isso costuma levar? Essa reflexão será retomada quando discutirmos governança de TI institucional.","body":"","tone":"lavender","icon":""}},{"id":"c-title-3-033","type":"titulo","props":{"text":"5. Um conceito maior: Software Público Brasileiro","level":"h2"}},{"id":"c-prose-3-034","type":"prose","props":{"body":"<p>O modelo de desenvolvimento do SUAP e do SIGAA — construído dentro do próprio setor público, cedido gratuitamente a outras instituições públicas por convênio, com código aberto — não é uma invenção isolada e espontânea de duas instituições do Rio Grande do Norte. Ele se encaixa em um conceito mais amplo, formalizado desde os anos 2000 pelo Governo Federal: o <strong>Software Público Brasileiro</strong>, uma política que incentiva o compartilhamento de soluções desenvolvidas com recursos públicos entre diferentes órgãos, evitando que cada prefeitura, universidade ou instituto precise \"reinventar a roda\" (e pagar por ela) para resolver problemas de gestão essencialmente parecidos.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-035","type":"prose","props":{"body":"<p>O sucesso do SUAP — hoje presente em 75 instituições, incluindo universidades e prefeituras — é, na prática, um dos exemplos mais bem-sucedidos e duradouros dessa filosofia de política pública: um Instituto Federal criou uma ferramenta para si mesmo, e, mais de uma década depois, essa ferramenta se tornou infraestrutura crítica de gestão para dezenas de outras instituições, sem que nenhuma delas precisasse pagar por uma licença comercial de ERP. É um contraponto real e concreto à ideia de que apenas grandes empresas privadas de tecnologia conseguem construir sistemas de gestão em larga escala.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-imagem-3-036","type":"imagem","bg":"neutral-default","pad":"normal","props":{"src":"assets/images/aula-01-image-006.png","slotId":"","caption":"Figura 6: SIGAA x SUAP — mesma origem, escopos diferentes","credit":"","ratio":"1400/520","alt":"SIGAA x SUAP — mesma origem, escopos diferentes"}},{"id":"c-title-3-038","type":"titulo","props":{"text":"6. Um contraste internacional: o modelo de mercado americano","level":"h2"}},{"id":"c-prose-3-039","type":"prose","props":{"body":"<p>Para perceber o quão particular é o modelo brasileiro de SIGAA e SUAP, vale olhar rapidamente para como esse mesmo tipo de sistema funciona nos Estados Unidos, mercado onde o setor de ERPs para ensino superior é dominado por duas empresas privadas: <strong>Ellucian</strong> (com o produto Banner, presente em mais de 1.400 instituições) e a <strong>PeopleSoft Campus Solutions</strong>, da Oracle. Ambas cobram das universidades um modelo de <strong>assinatura anual</strong>, geralmente calculado por número de estudantes matriculados em tempo integral, mais cobranças adicionais por módulos opcionais — ou seja, o custo cresce junto com o tamanho da instituição, de forma recorrente e indefinida.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-040","type":"prose","props":{"body":"<p>As avaliações de usuários reais desses sistemas, disponíveis em plataformas como Capterra e G2, trazem uma queixa recorrente que conecta diretamente com a tensão de personalização <em>X</em> padronização que discutimos na Seção 7: administradores relatam que esses sistemas comerciais <strong>\"vão forçar administradores de ensino superior a mudar seus processos de negócio para se adequar ao software\"</strong> — ou seja, a instituição é quem se adapta ao sistema, não o contrário, mesmo pagando uma licença cara por isso. Analistas do setor também apontam que a arquitetura legada de sistemas como o Banner (parcialmente construído em linguagem COBOL, tecnologia de décadas atrás) cria atrito real na hora de integrar com ferramentas mais modernas de IA e analytics — um lembrete de que sistemas antigos, mesmo comerciais e caros, também acumulam dívida técnica ao longo dos anos, exatamente como qualquer outro software.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-041","type":"prose","props":{"body":"<p>O contraste com o modelo SUAP/SIGAA é evidente: nenhuma instituição da Rede Federal paga licença anual por estudante matriculado; o \"custo\" está em outro lugar — na dependência técnica da instituição mantenedora (UFRN ou IFRN) que discutimos na Seção 4. São dois modelos de negócio radicalmente diferentes para resolver essencialmente o mesmo problema de gestão, e nenhum dos dois é gratuito de verdade: um cobra em dinheiro recorrente, o outro cobra em autonomia técnica.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-vejamais-3-042","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>A comparação entre Ellucian Banner e PeopleSoft Campus Solutions feita pela ibl.ai detalha as diferenças de arquitetura, integração e prontidão para IA entre os dois maiores sistemas comerciais de gestão acadêmica do mundo — uma leitura interessante para perceber como o \"problema\" que SIGAA e SUAP resolvem no Brasil é o mesmo que empresas bilionárias resolvem, de forma comercial, nos Estados Unidos.</p><ul><li><a href=\"https://ibl.ai/resources/comparisons/banner-vs-peoplesoft?org=Claro+NXT+Telecomunicacoes+Ltda\" target=\"_blank\" rel=\"noopener\">Ellucian Banner vs PeopleSoft Campus Solutions — comparação técnica</a></li></ul>","tone":"marigold","icon":"book-open"}},{"id":"c-reflection-3-043","type":"reflexao","props":{"title":"Para refletir (não vale nota)","question":"Se o IFSC tivesse que escolher hoje entre pagar uma licença anual por estudante a uma empresa privada (modelo americano) ou continuar dependendo tecnicamente de outra instituição pública (modelo SIGAA/SUAP), qual seria o critério mais importante para essa decisão: custo imediato, autonomia técnica, ou qualidade da experiência do usuário? Não existe resposta óbvia — é exatamente esse tipo de decisão estratégica que um gestor de TI educacional precisa tomar.","body":"","tone":"lavender","icon":""}},{"id":"c-title-3-044","type":"titulo","props":{"text":"7. Integração com o mundo exterior: Educacenso e PNP","level":"h2"}},{"id":"c-prose-3-045","type":"prose","props":{"body":"<p>Nenhum sistema acadêmico vive isolado. Os dados que circulam dentro do SIGAA ou do SUAP eventualmente precisam alimentar sistemas externos de coleta estatística nacional — como o <strong>Educacenso</strong> (Censo Escolar, para educação básica) e a <strong>Plataforma Nilo Peçanha</strong>, que já conhecemos em detalhe na Semana 2, para a Rede Federal especificamente.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-imagem-3-046","type":"imagem","bg":"neutral-default","pad":"normal","props":{"src":"assets/images/aula-01-image-007.png","slotId":"","caption":"Figura 7: Do sistema local ã estatística nacional","credit":"","ratio":"1400/480","alt":"Do sistema local ã estatística nacional"}},{"id":"c-prose-3-047","type":"prose","props":{"body":"<p>Isso levanta o mesmo desafio técnico que discutimos na semana passada: os dados internos de um sistema acadêmico usam uma modelagem própria (nomenclaturas, categorias, regras de negócio específicas da instituição), enquanto os sistemas de coleta nacional exigem um formato padronizado e comparável entre milhares de instituições diferentes. A tradução entre esses dois mundos — chamada tecnicamente de <strong>mapeamento de dados</strong> ou <em>data mapping</em> — é um trabalho invisível, mas crítico, normalmente feito por servidores de TI ou de Desenvolvimento Institucional, e é uma das fontes mais comuns de erro em relatórios institucionais, como vimos no caso real de divergência de matrículas discutido na Semana 2.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-title-3-048","type":"titulo","props":{"text":"8. Um contraponto crítico: personalização x padronização","level":"h2"}},{"id":"c-prose-3-049","type":"prose","props":{"body":"<p>Uma tensão central em qualquer sistema de gestão usado por múltiplas instituições — seja o SIGAA, seja o SUAP, seja o Ellucian Banner que vimos na Seção 6 — é a que existe entre <strong>personalização</strong> (cada instituição adapta o sistema à sua própria realidade e processos específicos) e <strong>padronização</strong> (todas as instituições seguem exatamente o mesmo processo, facilitando manutenção e comparabilidade nacional).</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-050","type":"prose","props":{"body":"<p>Personalização em excesso gera o problema que vimos no caso do IFG (oito meses para reintegrar customizações a uma nova versão). Padronização em excesso, por outro lado, pode forçar uma instituição a abandonar processos que fazem sentido para sua realidade local, só para se encaixar no molde do sistema — exatamente a queixa relatada por administradores universitários americanos sobre o Ellucian Banner, na Seção 6: o sistema \"força administradores a mudar seus processos de negócio para se adequar ao software\", em vez do contrário. Essa tensão nos remete, novamente, à crítica de Vitor Paro sobre gestão gerencialista, vista na Semana 1: um sistema que exige uniformidade total pode, sem perceber, apagar particularidades pedagógicas e administrativas legítimas de cada instituição, em nome de uma eficiência que é medida a partir de fora, não construída de dentro.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-3-051","type":"prose","props":{"body":"<p>Vale notar que essa tensão não é exclusividade de sistemas comerciais caros — o mesmo dilema aparece no modelo público brasileiro, só que com uma variável a mais: no SUAP e no SIGAA, quem decide o quanto de padronização é aceitável não é uma empresa com fins lucrativos, mas outra instituição pública (IFRN ou UFRN), o que muda a natureza da relação de poder envolvida, mas não elimina a tensão em si. Não existe resposta única e correta para esse dilema — mas um bom gestor de tecnologia educacional deveria, ao menos, ter consciência de que toda decisão de \"customizar\" ou \"padronizar\" tem um custo, mesmo quando esse custo não aparece imediatamente na tela do sistema.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-title-3-052","type":"titulo","props":{"text":"O que vem por aí","level":"h2"}},{"id":"c-prose-3-053","type":"prose","props":{"body":"<p>Na Semana 4, vamos sair da infraestrutura de sistemas e entrar na análise dos dados que eles produzem: indicadores educacionais e Learning Analytics.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c42xzr4y","type":"imagem","props":{"src":"assets/images/aula-01-image-008.png","slotId":"","caption":"Legenda da imagem.","credit":"Imagem gerada por IA (Google)","ratio":"16/9"}},{"id":"c-title-3-056","type":"titulo","props":{"text":"Glossário rápido desta semana","level":"h2"}},{"id":"c-accordion-3-057","type":"accordion","props":{"items":[{"title":"SIGE","body":"<p>Sistema de Informação para Gestão Educacional — aplicação do conceito de SI ao contexto educacional.</p>","children":[]},{"title":"ERP","body":"<p>Enterprise Resource Planning, software integrado e modular que centraliza processos organizacionais antes espalhados em sistemas isolados.</p>","children":[]},{"title":"SIGAA","body":"<p>Sistema Integrado de Gestão de Atividades Acadêmicas, desenvolvido pela UFRN, usado pelo IFSC.</p>","children":[]},{"title":"SUAP","body":"<p>Sistema Unificado de Administração Pública, desenvolvido pelo IFRN, usado por 75 instituições brasileiras.</p>","children":[]},{"title":"Ellucian Banner / PeopleSoft Campus Solutions","body":"<p>Os dois principais ERPs comerciais de gestão acadêmica usados por universidades nos Estados Unidos, cobrados via assinatura anual por estudante.</p>","children":[]},{"title":"ITIL","body":"<p>Information Technology Infrastructure Library, framework internacional de boas práticas de gestão de serviços de TI.</p>","children":[]},{"title":"Fatores Críticos de Sucesso (Critical Success Factors)","body":"<p>Conjunto de condições organizacionais (apoio da alta gestão, gestão de mudança, treinamento) que determinam o sucesso de uma implementação de ERP.</p>","children":[]},{"title":"Software Público Brasileiro","body":"<p>Política de compartilhamento de soluções tecnológicas desenvolvidas com recursos públicos entre diferentes órgãos do Estado.</p>","children":[]},{"title":"Educacenso","body":"<p>Censo Escolar, levantamento estatístico nacional da educação básica.</p>","children":[]},{"title":"Mapeamento de dados (data mapping)","body":"<p>Processo técnico de traduzir dados entre modelos e sistemas diferentes.</p>","children":[]}]}}]}},{"id":"b-synthesis-3-001","type":"sintese","bg":"sage-deep","pad":"airy","props":{"eyebrow":"Síntese","title":"Síntese conceitual","body":"<p>SIGAA e SUAP são exemplos concretos do conceito de Sistema de Informação que vimos na Semana 1 — e, tecnicamente, são ERPs de setor público, primos conceituais de sistemas comerciais bilionários como o Ellucian Banner e o PeopleSoft Campus Solutions, usados por universidades americanas mediante assinatura anual por estudante. Ambos, SIGAA e SUAP, carregam uma origem histórica comum (Rio Grande do Norte, anos 2000), mas escopos originalmente distintos (acadêmico x administrativo), o que explica por que instituições como o Ifal preferiram o SUAP mesmo tendo o SIGAA como alternativa. O crescimento do SUAP para 75 instituições — incluindo agora universidades e prefeituras — é um exemplo vivo do conceito de Software Público Brasileiro, e um contraponto real ao modelo comercial americano.</p><p>Usar um sistema mantido por outra instituição traz eficiência de escala, mas também dependência técnica, uma tensão que a literatura de Fatores Críticos de Sucesso em ERP já mapeia há décadas — e que se manifesta concretamente na escolha entre personalizar e padronizar, seja no modelo público brasileiro, seja no modelo comercial americano. Por trás de toda a interface amigável que o estudante vê, existe ainda um trabalho constante e pouco visível de integração desses dados com sistemas nacionais de coleta estatística, como vimos na Semana 2.</p>"}},{"id":"b-references-3-001","type":"referencias","bg":"neutral-default","pad":"normal","props":{"title":"Referências","items":["Portal do SUAP — Módulos e instituições conveniadas. Disponível em: https://portal.suap.ifrn.edu.br/.","IFRN. Sistema Suap impulsiona a modernização da gestão pública em municípios brasileiros, 2025.","Instituto Federal de Alagoas. Ifal inicia implantação do Suap, ferramenta que irá reunir sistemas em uma só plataforma, 2019.","Guia de Gestão Acadêmica da Graduação (SIGAA) — Universidade Federal do Ceará.","Instituto Federal de Goiás. Notícia sobre atualização do SUAP, 2024.","Portal do IFSC — Sistemas Acadêmicos. Disponível em: https://www.ifsc.edu.br/sistemas-academicos.","ibl.ai. Ellucian Banner vs PeopleSoft Campus Solutions, 2026.","Avaliações de usuários sobre Ellucian Banner — Capterra e G2, 2023-2026.","Literatura clássica de Fatores Críticos de Sucesso em ERP (ex.: Somers & Nelson, 2001; Umble, Haft & Umble, 2003)."]}}]}
</script>

function waitForPrintableAssets() {
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();

    if (img.complete) return Promise.resolve();

      img.addEventListener("error", resolve, { once: true });
    });
  });
  return Promise.all([fonts].concat(images)).then(function () {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {

      });
    });
  });
}
